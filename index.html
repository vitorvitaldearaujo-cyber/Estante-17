  function fileRowId(name,idx,batch='x'){ return 'frow-'+batch+'-'+idx+'-'+name.replace(/[^a-z0-9]/gi,''); }

  async function handleFiles(files){
    if(!files.length) return;
    let over = false;
    if(files.length>50){ over = true; files = files.slice(0,50); }
    const list = $('#fileList');
    const batchId = Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
    const rowIds = files.map((f,i)=>fileRowId(f.name,i,batchId));
    files.forEach((f,i)=>{
      const row = document.createElement('div');
      row.className='file-row'; row.id=rowIds[i];
      row.innerHTML = `<span class="fname">${escapeHtml(f.name)}</span><span class="fstatus">Na fila…</span>`;
      list.appendChild(row);
    });
    if(over) toast('Você selecionou mais de 10 arquivos. Apenas os 50 primeiros foram colocados na fila.');
    const progWrap = $('#importProgressWrap');
    const progFill = $('#importProgressFill');
    const progText = $('#importProgressText');
    const progPct = $('#importProgressPct');
    if(progWrap) progWrap.style.display='block';
    const total = files.length;
    function setProgress(done){
      const pct = Math.round((done/total)*100);
      if(progFill) progFill.style.width = pct+'%';
      if(progPct) progPct.textContent = pct+'%';
      if(progText) progText.textContent = done>=total ? 'Concluído' : ('Importando '+done+' de '+total+'…');
    }
    setProgress(0);
    let okCount=0, errCount=0;
    for(let i=0;i<files.length;i++){
      const file = files[i];
      const row = document.getElementById(rowIds[i]);
      const statusEl = row && row.querySelector('.fstatus');
      if(statusEl){ statusEl.textContent='Processando…'; }
      if(progText) progText.textContent = 'Processando: '+file.name;
      try{
        const book = await processFile(file);
        await idbPut('books', book);
        books.push(book);
        if(statusEl){
          if(book.importError){ statusEl.textContent='Importado (parcial)'; statusEl.classList.add('ok'); }
          else { statusEl.textContent='Importado ✓'; statusEl.classList.add('ok'); }
        }
        okCount++;
      }catch(err){
        console.error(err);
        if(statusEl){ statusEl.textContent='Erro'; statusEl.classList.add('err'); }
        errCount++;
      }
      setProgress(i+1);
    }
    refreshViews();
    if(okCount) toast(okCount+' livro(s) importado(s) com sucesso.');
    if(errCount) toast(errCount+' arquivo(s) não puderam ser importados.');
  }

  function render(){
    $$('.nav-btn').forEach(b=> { const active=b.dataset.nav===view; b.classList.toggle('active', active); if(active) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
    const main = $('#main');
    if(view==='home') main.innerHTML = renderHome();
    else if(view==='library') main.innerHTML = renderLibrary();
    else if(view==='shelves') main.innerHTML = renderShelves();
    else if(view==='profile') main.innerHTML = renderProfile();
    wireViewEvents();
  }

  function stats(){
    const reading = books.filter(b=>b.status==='reading').length;
    const finished = books.filter(b=>b.status==='finished').length;
    const favs = books.filter(b=>b.favorite).length;
    return {total:books.length, reading, finished, favs};
  }

  function coverHtml(book){
    const g = ['g0','g1','g2'][book.gradient%3];
    if(book.cover){
      return `<img src="${book.cover}" alt="Capa de ${escapeHtml(book.title)}" loading="lazy">`;
    }
    return `<div class="cover-fallback ${g}"><small>${escapeHtml((book.format||'arquivo').toUpperCase())}</small><strong>${escapeHtml(book.title)}</strong><small>${escapeHtml(book.author||'')}</small></div>`;
  }

  function bookCard(book){
    const pct = Math.round((book.progress||0)*100);
    const canAudio = !!(book.chapters && book.chapters.length);
    const isNowPlaying = ttsState.bookId === book.id && ttsState.playing;
    return `<div class="book" data-id="${book.id}">
      <div class="cover-wrap">
        ${coverHtml(book)}
        <span class="fmt-badge">${escapeHtml((book.format||'').toUpperCase())}</span>
        ${book.favorite?'<span class="fav-badge">★</span>':''}
        ${canAudio ? `<span class="book-audio-badge" title="Disponível em áudio">${isNowPlaying?'🔊':'🎧'}</span>` : ''}
        <div class="sel-badge"><span>✓</span></div>
      </div>
      ${book.status==='reading' || isNowPlaying ? `<div class="book-progress"><i style="width:${pct}%"></i></div>` : ''}
      <div class="book-info">
        <div class="book-title">${escapeHtml(book.title)}</div>
        <div class="book-author">${escapeHtml(book.author||'Autor desconhecido')}</div>
      </div>
    </div>`;
  }

  function readingTips(readingBooks){
    const todayMs = todayReadMs();
    const goal = (settings.dailyGoalMin||30)*60000;
    const remaining = Math.max(0, goal - todayMs);
    let tip = '';
    if(readingBooks.length===0){
      tip = 'Comece um livro hoje! Mesmo 15–20 minutos por dia criam o hábito.';
    } else if(todayMs === 0){
      tip = 'Você ainda não leu hoje. Que tal 20–30 minutos agora?';
    } else if(remaining > 0){
      tip = `Faltam cerca de ${fmtDuration(remaining)} para atingir sua meta diária. Continue!`;
    } else {
      tip = 'Meta diária atingida! Parabéns. Uma pausa ou mais um pouco?';
    }
    if(readingBooks.length){
      const b = readingBooks[0];
      const pct = Math.round((b.progress||0)*100);
      const left = 100-pct;
      if(left > 0 && left < 30) tip += ` "${b.title}" está quase no fim (${pct}%).`;
    }
    return tip;
  }

      </section>

    <div class="stats-row">
      <div class="stat-card"><strong>${s.reading}</strong><span class="muted">Em andamento</span></div>
      <div class="stat-card"><strong>${s.finished}</strong><span class="muted">Concluídos</span></div>
      <div class="stat-card"><strong>${s.favs}</strong><span class="muted">Favoritos</span></div>
      <div class="stat-card"><strong>${fmtDuration(todayReadMs())}</strong><span class="muted">Tempo hoje</span></div>
    </div>
    ${readingBooks.length ? `

      <div class="section-head"><h2>Lendo agora</h2></div>

      <div class="section-head"><h2>Adicionados recentemente</h2><button class="btn small" data-nav-go="library">Ver biblioteca</button></div>
      ${recentBooks.length ? `<div class="books-grid">${recentBooks.map(bookCard).join('')}</div>`
        : `<div class="empty"><b>Sua biblioteca está vazia</b>Importe arquivos EPUB, PDF, TXT ou CBZ para começar.<div style="margin-top:14px;"><button class="btn primary" data-action="import"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Importar livros</button></div></div>`}
    </section>`;

  function shelfCard(sh){
    const count = books.filter(b=> (b.shelfIds||[]).includes(sh.id)).length;
    return `<button class="shelf-card" data-shelf="${sh.id}"><span class="shelf-icon">${sh.icon||'📚'}</span><div><b>${escapeHtml(sh.name)}</b><span class="muted">${count} livro${count===1?'':'s'}</span></div></button>`;

  function filteredSortedBooks(){
    let list = books.slice();
    if(libFilter==='reading') list = list.filter(b=>b.status==='reading');
    else if(libFilter==='finished') list = list.filter(b=>b.status==='finished');
    else if(libFilter==='favorites') list = list.filter(b=>b.favorite);
    if(libQuery.trim()){
      const q = libQuery.trim().toLowerCase();
      list = list.filter(b=> (b.title||'').toLowerCase().includes(q) || (b.author||'').toLowerCase().includes(q));
    }
    if(libSort==='title') list.sort((a,b)=> (a.title||'').localeCompare(b.title||'','pt-BR'));
    else if(libSort==='author') list.sort((a,b)=> (a.author||'').localeCompare(b.author||'','pt-BR'));
    else list.sort((a,b)=> b.addedAt-a.addedAt);
    return list;
  }

  function wireViewEvents(){
    $$('[data-nav-go]').forEach(b=> b.addEventListener('click', ()=> setView(b.dataset.navGo)));
    const importBtn = $('#heroImportBtn'); if(importBtn) importBtn.addEventListener('click', openImportModal);
    $$('[data-action="import"]').forEach(b=> b.addEventListener('click', openImportModal));
    $$('[data-action="new-shelf"]').forEach(b=> b.addEventListener('click', openNewShelfModal));
    $$('.shelf-card[data-shelf]').forEach(b=> b.addEventListener('click', ()=> openShelfBooks(b.dataset.shelf)));
    $$('.book').forEach(b=> b.addEventListener('click', ()=>{
      if(selectionMode){ toggleSelect(b.dataset.id); return; }
      openBookDetail(b.dataset.id);
    }));
    const libSearch = $('#libSearch');
    if(libSearch) libSearch.addEventListener('input', debounce(e=>{ const value=e.target.value; const pos=e.target.selectionStart||value.length; libQuery=value; render(); const next=$('#libSearch'); if(next){ next.focus(); try{ next.setSelectionRange(pos,pos); }catch(err){} } },250));
    const libSortEl = $('#libSort');
    if(libSortEl) libSortEl.addEventListener('change', e=>{ libSort=e.target.value; render(); });
    $$('.chip[data-filter]').forEach(c=> c.addEventListener('click', ()=>{ libFilter=c.dataset.filter; render(); }));
    const toggleSel = $('#toggleSelect');
    if(toggleSel) toggleSel.addEventListener('click', ()=>{ selectionMode=!selectionMode; selected.clear(); render(); });
    const dlSel = $('#downloadSelected');
    if(dlSel) dlSel.addEventListener('click', downloadSelected);
    const pS = $('#profileSettings'); if(pS) pS.addEventListener('click', openSettingsModal);
    const pI = $('#profileImport'); if(pI) pI.addEventListener('click', openImportModal);
    const editP = $('#editProfileBtn'); if(editP) editP.addEventListener('click', openProfileEditor);
  }

  function toggleSelect(id){
    if(selected.has(id)) selected.delete(id);
    else{
      if(selected.size>=10){ toast('Você pode selecionar até 10 livros por vez.'); return; }
      selected.add(id);
    }
    render();
  }

  async function downloadSelected(){
    const list = books.filter(b=> selected.has(b.id));
    let count=0;
    for(const b of list){
      if(!b.fileBlob){ toast('"'+b.title+'" não tem arquivo original salvo.'); continue; }
      const url = URL.createObjectURL(b.fileBlob);
      const a = document.createElement('a');
      a.href = url; a.download = (b.title||'livro') + '.' + (b.format||'dat');
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      count++;
      await sleep(350);
    }
    toast(count+' arquivo(s) baixado(s).');
    selectionMode=false; selected.clear(); render();
  }

  function openShelfBooks(shelfId){
    const sh = shelves.find(s=>s.id===shelfId);
    if(!sh) return;
    view='library'; libFilter='all'; libQuery='';
    render();
    const list = books.filter(b=> (b.shelfIds||[]).includes(shelfId));
    const main = $('#main');
    main.innerHTML = `
    <div class="eyebrow">Estante</div>
    <h1 class="page-title">${escapeHtml(sh.icon||'📚')} ${escapeHtml(sh.name)}</h1>
    <div class="toolbar"><button class="btn small" id="backToShelves">← Todas as estantes</button><button class="btn small danger" id="deleteShelf">Excluir estante</button></div>
    ${list.length ? `<div class="books-grid">${list.map(bookCard).join('')}</div>` : `<div class="empty"><b>Estante vazia</b>Adicione livros a partir dos detalhes de cada livro.</div>`}`;
    $('#backToShelves').addEventListener('click', ()=> setView('shelves'));
    $('#deleteShelf').addEventListener('click', ()=> deleteShelf(shelfId));
    $$('.book').forEach(b=> b.addEventListener('click', ()=> openBookDetail(b.dataset.id)));
  }

  async function deleteShelf(shelfId){
    if(!confirm('Excluir esta estante? Os livros continuam na sua biblioteca.')) return;
    shelves = shelves.filter(s=>s.id!==shelfId);
    books.forEach(b=>{ b.shelfIds = (b.shelfIds||[]).filter(id=>id!==shelfId); });
    await idbDelete('shelves', shelfId);
    for(const b of books) await saveBook(b);
    toast('Estante excluída.');
    setView('shelves');
  }

  function celebrateBookFinished(book){
    const layer=document.createElement('div');layer.className='book-finish-particles';layer.setAttribute('aria-hidden','true');
    for(let i=0;i<16;i++){const p=document.createElement('i');const angle=(Math.PI*2*i/16)+Math.random()*.22,dist=34+Math.random()*66;p.style.setProperty('--spark-x',(Math.cos(angle)*dist)+'px');p.style.setProperty('--spark-y',(Math.sin(angle)*dist)+'px');p.style.animationDelay=(Math.random()*.12)+'s';layer.appendChild(p)}
    document.body.appendChild(layer);setTimeout(()=>layer.remove(),1250);toast('Leitura concluída! Mais uma história na sua jornada.');
  }

  function openPinSetup(isChange){
    let step = isChange ? 'old' : 'new';
    let firstPin = '';
    let current = '';
    function renderPinUI(){
      const titles = {old:'Digite o PIN atual', new:'Defina um PIN (4–6 dígitos)', confirm:'Confirme o novo PIN'};
      $('#modalRoot').innerHTML = `
      <div class="modal-bg" id="pinSetupBg">
        <div class="modal">
          <div class="modal-head"><h3>${titles[step]}</h3><button class="close-x" id="pinSetupClose">✕</button></div>
          <div class="modal-body" style="text-align:center;">
            <div class="pin-dots" id="psDots">${[0,1,2,3,4,5].map(()=>'<div class="pin-dot"></div>').join('')}</div>
            <div class="pin-pad" style="margin:0 auto;">
              ${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>{
                if(k==='') return '<div></div>';
                return `<button class="pin-key ${k==='⌫'?'action':''}" data-k="${k}">${k}</button>`;
              }).join('')}
            </div>
            <button class="btn dark" id="psContinue" style="margin-top:16px;min-width:160px;" disabled>Continuar</button>
            <p class="muted" id="psErr" style="margin-top:12px;min-height:20px;color:var(--danger);"></p>
          </div>
        </div>
      </div>`;
      function updateDots(){
        $$('#psDots .pin-dot').forEach((d,i)=> d.classList.toggle('filled', i < current.length));
      }
      $('#pinSetupBg').addEventListener('click', e=>{ if(e.target.id==='pinSetupBg') closeModal(); });
      $('#pinSetupClose').addEventListener('click', closeModal);
      function syncContinue(){
        const b=$('#psContinue'); if(b) b.disabled=current.length<4;
      }
      async function advancePin(){
        if(current.length<4) return;
        if(step==='old'){
          const h=await hashPin(current);
          if(h!==settings.pinHash){
            $('#psErr').textContent='PIN incorreto'; current=''; updateDots(); syncContinue();
            setTimeout(()=>{ const e=$('#psErr'); if(e) e.textContent=''; },1200); return;
          }
          step='new'; current=''; firstPin=''; renderPinUI();
        } else if(step==='new'){
          firstPin=current; step='confirm'; current=''; renderPinUI();
        } else {
          if(current!==firstPin){
            $('#psErr').textContent='Os PINs não coincidem'; current=''; updateDots(); syncContinue();
            setTimeout(()=>{ const e=$('#psErr'); if(e) e.textContent=''; },1500); return;
          }
          settings.pinHash=await hashPin(current); saveSettings(); closeModal(); toast('PIN definido com sucesso.'); openSettingsModal();
        }
      }
      $$('[data-k]').forEach(btn=> btn.addEventListener('click', ()=>{
        const k=btn.dataset.k;
        if(k==='⌫') current=current.slice(0,-1);
        else if(current.length<6) current+=k;
        updateDots(); syncContinue();
      }));
      $('#psContinue').addEventListener('click', advancePin);
    }
    renderPinUI();
  }

  let ttsState = {

  };
  // restore preferred voice
  if(settings.voiceURI) ttsState.voiceURI = settings.voiceURI;

  function classifyVoiceGender(v){
    const n = ((v && (v.name||'')) + ' ' + (v && (v.voiceURI||''))).toLowerCase();
    // A classificação usa apenas pistas explícitas no nome da voz;
    // quando não há indicação confiável, ela fica em "outras".
    if(/female|woman|mulher|femin|\bmaria\b|\blucia\b|luciana|francisca|vit[oó]ria|helena|joana|in[eê]s|sofia|camila|bruna|\bana\b|clara|let[ií]cia|beatriz|amanda|fernanda|raquel|tatiana|m[oô]nica|samantha|zira|jenny|hazel|kendra|sara|tessa|aria|nat[aá]lia|isabela|b[aá]rbara|emily/i.test(n)) return 'fem';
    if(/male|\bman\b|homem|masc|\bant[oô]nio\b|\bdaniel\b|ricardo|felipe|thiago|andr[eé]|jo[aã]o|pedro|miguel|bruno|carlos|arthur|rafael|mateus|marcos|david|alex|davi|henrique|gabriel|jorge|gustavo|paulo|enrique|thomas|fred|rodrigo|leonardo|eduardo|s[eé]rgio|luiz|vin[ií]cius|caio|bernardo|samuel|lucas|maur[ií]cio|masculino|male_\d+/i.test(n)) return 'masc';
    return 'other';
  }
  function isNaturalVoice(v){
    return /natural|neural|online|premium|enhanced|wavenet|studio/i.test(((v&&v.name)||'')+' '+((v&&v.voiceURI)||''));
  }
  function getAvailableVoices(){
    if(!window.speechSynthesis) return [];
    const voices = speechSynthesis.getVoices() || [];
    const pt = voices.filter(v=> /^pt(-|_|$)/i.test(v.lang||''));
    const rest = voices.filter(v=> !/^pt(-|_|$)/i.test(v.lang||''));
    // Prioriza português do Brasil e opções identificadas como naturais/neural.
    const sortFn = (a,b)=>{
      const brA=/^pt(-|_)br/i.test(a.lang||''), brB=/^pt(-|_)br/i.test(b.lang||'');
      if(brA!==brB) return brA?-1:1;
      const natA=isNaturalVoice(a),natB=isNaturalVoice(b);
      if(natA!==natB) return natA?-1:1;
      if(a.localService!==b.localService) return a.localService?1:-1;

function chunkText(text, size){
    size = size || 1800;

        const lastSpace = Math.max(slice.lastIndexOf('. '), slice.lastIndexOf('! '), slice.lastIndexOf('? '), slice.lastIndexOf('\n'));
        if(lastSpace > size * 0.4) end = i + lastSpace + 1;
      }
      // Não cortar palavras ao trocar de utterance: isso evita saltos no destaque.
      if(end < text.length){
        while(end > i && !/\s/.test(text.charAt(end))) end--;
        if(end === i){ end = Math.min(text.length, i + size); while(end < text.length && !/\s/.test(text.charAt(end))) end++; }
      }

      if(spoken) chunks.push({text:spoken,start:i+leading,end:i+leading+spoken.length});

    // mantém a última palavra como referência para concluir o progresso corretamente.
    return lo<words.length?lo:words.length-1;
  }

      const nodeStart=piece.start,nodeEnd=piece.end;let lo=0,hi=matches.length;
      while(lo<hi){const mid=(lo+hi)>>1;if(matches[mid].end<=nodeStart)lo=mid+1;else hi=mid;}
      for(let i=lo;i<matches.length&&matches[i].start<nodeEnd;i++){

  function paintAudioWord(scope,index,animate){
    if(!scope||index<0)return;
    scope.querySelectorAll('.audio-word-current').forEach(el=>el.classList.remove('audio-word-current','audio-word-pop'));
    const words=scope.querySelectorAll(`[data-audio-word="${index}"]`);if(!words.length)return;
    words.forEach(word=>{word.classList.add('audio-word-current');if(animate){word.classList.remove('audio-word-pop');void word.offsetWidth;word.classList.add('audio-word-pop');}});

  function prepareAudioChunk(book){
    if(!book || activeReaderBookId !== book.id) return;
    const body = $('#readerBody');
    if(!body) return;
    const pageRoot = $('#pageContent');
    if(pageRoot){
      const base = (pagedState && pagedState.bookId === book.id && pagedState.pageWordStarts)
        ? (pagedState.pageWordStarts[pagedState.pageIdx] || 0) : 0;
      const count = (pagedState && pagedState.pageWordCounts)
        ? (pagedState.pageWordCounts[pagedState.pageIdx] || 0) : 0;
      // Decorate every word on the visible page so highlight always finds a target
      const pageStart = base;
      const pageEnd = count > 0 ? base + count - 1 : Math.max(ttsState.currentChunkEndWord, base);
      const startWord = Math.min(ttsState.currentChunkStartWord, pageStart);
      const endWord = Math.max(ttsState.currentChunkEndWord, pageEnd);
      decorateAudioWords(pageRoot, base, pageStart, pageEnd >= pageStart ? pageEnd : endWord);
      if(ttsState.currentWordIndex >= 0) paintAudioWord(pageRoot, ttsState.currentWordIndex, false);
    } else {
      const textRoot = $('#reflowText');
      if(!textRoot) return;
      decorateAudioWords(textRoot, 0, ttsState.currentChunkStartWord, ttsState.currentChunkEndWord);
      if(ttsState.currentWordIndex >= 0) paintAudioWord(textRoot, ttsState.currentWordIndex, false);
    }
  }

function followAudioWord(book, index){
    if(!book || activeReaderBookId !== book.id || !ttsState.playing || ttsState.paused || ttsState.bookId !== book.id) return;
    if(!Number.isFinite(index) || index < 0) return;
    const body = $('#readerBody');
    if(!body) return;
    const pageJumpInput = $('#pageJumpInput');
    if((pageJumpInput && document.activeElement === pageJumpInput) ||
       (pagedState && pagedState.bookId === book.id && pagedState.pageJumpEditing)) return;

    // Page mode: keep page aligned with spoken word
    if(body.querySelector('.reader-paged') && pagedState && pagedState.bookId === book.id){
      let targetPage = pagedState.pageIdx;
      if(typeof pagedState.pageForWord === 'function'){
        const mapped = pagedState.pageForWord(index);
        if(Number.isInteger(mapped)) targetPage = mapped;
      } else if(pagedState.pageWordStarts && pagedState.pageWordCounts){
        // fallback binary search
        const starts = pagedState.pageWordStarts;
        const counts = pagedState.pageWordCounts;
        for(let i = 0; i < starts.length; i++){
          const s = starts[i] || 0, e = s + (counts[i] || 0);
          if(index >= s && index < e){ targetPage = i; break; }
          if(index >= s) targetPage = i;
        }
      }
      if(targetPage !== pagedState.pageIdx && typeof pagedState.goToAudioPage === 'function'){
        pagedState.goToAudioPage(targetPage);
        setTimeout(()=>{
          if(!ttsState.playing || ttsState.bookId !== book.id) return;
          prepareAudioChunk(book);
          paintAudioWord($('#pageContent') || body, index, true);
        }, 420);
        return;
      }
    }

    let target = body.querySelector('[data-audio-word="'+index+'"]');
    if(!target){
      // Re-decorate then retry once
      prepareAudioChunk(book);
      target = body.querySelector('[data-audio-word="'+index+'"]');
    }
    if(!target){
      // Progress-based page nudge when word markup missing
      if(pagedState && pagedState.bookId === book.id && pagedState.pages && pagedState.pages.length > 1 && typeof pagedState.goToAudioPage === 'function'){
        const total = (ttsState.wordRanges || []).length || 1;
        const approx = Math.min(pagedState.pages.length - 1, Math.max(0, Math.floor((index / total) * pagedState.pages.length)));
        if(approx !== pagedState.pageIdx) pagedState.goToAudioPage(approx);
      }
      return;
    }
    paintAudioWord(body, index, true);
    if(!body.querySelector('.reader-paged')){
      const rect = target.getBoundingClientRect(), view = body.getBoundingClientRect(), margin = 56;
      if(rect.top < view.top + margin || rect.bottom > view.bottom - margin){
        const top = body.scrollTop + rect.top - view.top - body.clientHeight * 0.36;
        body.scrollTo({ top, behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
      }
    }
  }

function updateAudioUI(){
    const playBtn = $('#audioPlayBtn');
    const fill = $('#audioProgressFill');
    const label = $('#audioProgressLabel');
    const statusEl = $('#audioStatusText');
    const statusDot = $('#audioStatusDot');
    const speedBtn = $('#audioSpeedBtn');
    const icon = $('#audioIcon');
    const wave = $('#audioWave');
    const pctLabel = $('#audioPctLabel');
    if(speedBtn) speedBtn.textContent = ttsState.rate.toFixed(1).replace(/\.0$/,'') + '×';
    const isActive = ttsState.playing && !ttsState.paused;
    if(playBtn){
      if(isActive){
        playBtn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" fill="currentColor" stroke="none"/></svg>';
        playBtn.setAttribute('aria-label','Pausar');
        playBtn.classList.add('is-playing');
      } else {
        playBtn.innerHTML = '<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"/></svg>';
        playBtn.setAttribute('aria-label','Reproduzir');
        playBtn.classList.remove('is-playing');
      }
    }
    if(icon) icon.classList.toggle('playing', isActive);
    if(wave) wave.classList.toggle('on', isActive);
    if(statusDot){
      statusDot.classList.toggle('on', isActive);
      statusDot.classList.toggle('pause', ttsState.playing && ttsState.paused);
    }
    if(statusEl){
      if(isActive) statusEl.textContent = 'Reproduzindo';
      else if(ttsState.playing && ttsState.paused) statusEl.textContent = 'Pausado';
      else if(ttsState.chunks.length) statusEl.textContent = 'Pronto';
      else statusEl.textContent = 'Toque para ouvir';
    }
    const total = ttsState.chunks.length || 1;
    const idx = Math.min(ttsState.chunkIdx, total - 1);
    const pct = ttsState.chunks.length
      ? Math.min(100, Math.round(((idx + (isActive ? 0.35 : 0)) / total) * 100))
      : 0;
    if(fill) fill.style.width = pct + '%';
    if(label){
      if(ttsState.chunks.length) label.textContent = (idx + 1) + ' / ' + total;
      else label.textContent = '—';
    }
    if(pctLabel) pctLabel.textContent = pct + '%';
    // Sync global mini player when outside reader
    if($('#miniPlayer') && $('#miniPlayer').classList.contains('show')){

    }

  function speakNextChunk(book){
    if(!ttsState.playing || ttsState.paused) return;
    if(ttsState.chunkIdx >= ttsState.chunks.length){
      ttsState.playing = false;
      ttsState.paused = false;
      ttsState.currentWordIndex=-1;clearAudioWordMarkup($('#readerRoot'));
      ttsPlaying = false;
      updateAudioUI();
      hideMiniPlayer();
      toast('Leitura em áudio concluída.');
      if(book){ const wasFinished=book.status==='finished';book.progress=1;book.audioProgress=1;book.audioWordCursor=Math.max(0,ttsState.wordRanges.length-1);ttsState.resumeWordCursor=book.audioWordCursor;book.status='finished';const pl=$('#readerProgressLabel'),pf=$('#readerProgressFill');if(pl)pl.textContent='100%';if(pf)pf.style.width='100%';saveBook(book);if(!wasFinished)celebrateBookFinished(book);render(); }
      return;
    }
    const chunk = ttsState.chunks[ttsState.chunkIdx];
    const text = chunk.text;
    ttsState.currentChunkStartChar=chunk.start;
    ttsState.currentChunkStartWord=audioWordAt(chunk.start);
    ttsState.currentChunkEndWord=audioWordAt(Math.max(chunk.start,chunk.start+text.length-1));
    const requestedCursor=ttsState.resumeWordCursor;
    const cursor=Number.isInteger(requestedCursor)&&requestedCursor>=ttsState.currentChunkStartWord&&requestedCursor<=ttsState.currentChunkEndWord?requestedCursor:ttsState.currentChunkStartWord;
    const resumeChar=ttsState.wordRanges[cursor]?ttsState.wordRanges[cursor].start:chunk.start;
    const resumeOffset=Math.max(0,Math.min(text.length,resumeChar-chunk.start));
    const spokenText=text.slice(resumeOffset);
    ttsState.currentWordIndex=cursor;
    ttsState.resumeWordCursor=cursor;
    prepareAudioChunk(book);
    const u = new SpeechSynthesisUtterance(spokenText);
    u.lang = 'pt-BR';
    u.rate = ttsState.rate;
    u.pitch = 1;
    // Use selected voice (online neural when available) or best pt-BR
    try{
      const v = pickVoiceForUtterance();
      if(v){ u.voice = v; if(v.lang) u.lang = v.lang; }
    }catch(e){}
    u.onstart = ()=>{
      if(ttsState.utterance!==u)return;
      startAudioFallback(book,u,chunk,resumeOffset,spokenText);
      if(ttsState.playing&&!ttsState.paused&&ttsState.currentWordIndex>=0){updateAudioReadingProgress(book,ttsState.currentWordIndex);followAudioWord(book,ttsState.currentWordIndex);}
    };
    u.onboundary = event=>{
      if(ttsState.utterance!==u||!ttsState.playing||ttsState.paused||!Number.isFinite(event.charIndex))return;
      const local=Math.max(0,Math.min(spokenText.length,Math.floor(event.charIndex)));
      if(local>ttsState.fallbackPositionChar){ttsState.fallbackPositionChar=local;ttsState.fallbackAnchorChar=local;ttsState.fallbackAnchorAt=Date.now();ttsState.fallbackLastBoundaryAt=Date.now();}
      const wordIndex=audioWordAt(chunk.start+resumeOffset+local);
      if(wordIndex>ttsState.currentWordIndex&&wordIndex<=ttsState.currentChunkEndWord){ttsState.currentWordIndex=wordIndex;updateAudioReadingProgress(book,wordIndex);followAudioWord(book,wordIndex);}
    };
    u.onend = ()=>{
      if(ttsState.utterance!==u||!ttsState.playing||ttsState.paused) return;
      clearAudioFallback();ttsState.utterance=null;ttsUtterance=null;
      ttsState.chunkIdx++;
      // Keep the exact word cursor aligned across chunk transitions.
      if(book && ttsState.chunks.length){
        updateAudioReadingProgress(book,ttsState.currentChunkEndWord);
        if(ttsState.chunkIdx<ttsState.chunks.length){
          const nextChunk=ttsState.chunks[ttsState.chunkIdx];
          ttsState.resumeWordCursor=audioWordAt(nextChunk.start);
        }
        if(book.status!=='finished')book.status='reading';
        saveBookDebounced(book);
      }
      updateAudioUI();
      speakNextChunk(book);
    };
    u.onerror = ()=>{
      if(ttsState.utterance!==u)return;
      clearAudioFallback();ttsState.utterance=null;ttsUtterance=null;
      ttsState.playing = false;
      ttsState.paused = false;
      ttsState.currentWordIndex=-1;clearAudioWordMarkup($('#readerRoot'));
      updateAudioUI();
      toast('Erro na síntese de voz. Tente novamente.');
    };
    ttsState.utterance = u;
    ttsUtterance = u;
    speechSynthesis.speak(u);
    updateAudioUI();
  }

  function startAudioFromProgress(book){
    if(!window.speechSynthesis){ toast('Síntese de voz não disponível neste navegador.'); return; }
    const model = buildUnifiedAudioModel(book);
    const full = model.full || '';
    if(!full.trim()){ toast('Não há texto para ouvir neste livro.'); return; }
    ttsState.chunks = chunkText(full, 1400);
    ttsState.wordRanges = model.wordRanges;
    ttsState.currentWordIndex = -1;
    ttsState.totalChars = full.length;
    ttsState.fromPages = !!model.fromPages;
    const savedAudioProgress = Number.isFinite(book.audioProgress) ? book.audioProgress : (book.progress || 0);
    const legacyCursor = Math.round(Math.max(0, Math.min(1, savedAudioProgress)) * Math.max(0, ttsState.wordRanges.length - 1));
    const savedCursor = Number.isInteger(book.audioWordCursor) ? book.audioWordCursor : legacyCursor;
    const resumeCursor = savedAudioProgress >= 1 ? 0 : Math.max(0, Math.min(Math.max(0, ttsState.wordRanges.length - 1), savedCursor));
    const resumeChar = ttsState.wordRanges[resumeCursor] ? ttsState.wordRanges[resumeCursor].start : 0;
    let startIdx = ttsState.chunks.findIndex((chunk, i) => resumeChar >= chunk.start && (i === ttsState.chunks.length - 1 || resumeChar < ttsState.chunks[i + 1].start));
    if(startIdx < 0) startIdx = 0;
    ttsState.chunkIdx = startIdx;
    ttsState.resumeWordCursor = resumeCursor;
    ttsState.bookId = book.id;
    ttsState.rate = ttsState.rate || 1;
    ttsState.playing = true;
    ttsState.paused = false;
    ttsPlaying = true;
    if(speechSynthesis.getVoices().length === 0){
      speechSynthesis.addEventListener('voiceschanged', ()=> speakNextChunk(book), {once:true});
    }
    cancelCurrentSpeech();
    speakNextChunk(book);
    toast('Reproduzindo áudio…');
  }

function toggleAudioPlay(book){
    if(!window.speechSynthesis){ toast('Síntese de voz não disponível neste navegador.'); return; }
    if(ttsState.playing && !ttsState.paused){
      speechSynthesis.pause();
      ttsState.paused = true;reanchorAudioFallback();
      updateAudioUI();
      return;
    }
    if(ttsState.playing && ttsState.paused){
      speechSynthesis.resume();
      ttsState.paused = false;reanchorAudioFallback();
      updateAudioUI();
      return;
    }
    startAudioFromProgress(book);
  }

  function resumeAudioChunk(book,keepPaused){
    if(!ttsState.playing)return;

  }
  function skipAudioChunk(dir, book){
    if(!ttsState.chunks.length) return;

    ttsState.chunkIdx = Math.max(0, Math.min(ttsState.chunks.length-1, ttsState.chunkIdx + dir));
    if(book&&ttsState.chunks.length){
      const selected=ttsState.chunks[ttsState.chunkIdx];updateAudioReadingProgress(book,audioWordAt(selected.start));
    }
    if(ttsState.playing){
      if(book)resumeAudioChunk(book,wasPaused);else updateAudioUI();
    }else updateAudioUI();
  }

  function cycleAudioSpeed(){

    updateAudioUI();

  }

  function renderReflow(book, body){
    clearPagedHandlers();
    body.classList.remove('page-mode');
    body.innerHTML = `<div class="reader-text" id="reflowText">${(book.chapters||[]).join('<hr style="border:0;border-top:1px solid var(--line);margin:2.4em 0;">')}</div>`;
    if(ttsState.playing&&ttsState.bookId===book.id)prepareAudioChunk(book);
    const max = ()=> Math.max(0, body.scrollHeight - body.clientHeight);
    const applyProgressUI = (p)=>{
      const label = $('#readerProgressLabel'), fill = $('#readerProgressFill');
      if(label) label.textContent = Math.round(p*100)+'%';
      if(fill) fill.style.width = Math.round(p*100)+'%';
    };
    // Restore position after layout
    requestAnimationFrame(()=>{
      setTimeout(()=>{
        const m = max();
        if(m>0) body.scrollTop = (book.progress||0)*m;
        applyProgressUI(book.progress||0);
        if(ttsState.playing&&!ttsState.paused&&ttsState.bookId===book.id&&ttsState.currentWordIndex>=0)followAudioWord(book,ttsState.currentWordIndex);
      }, 50);
    });
    body.onscroll = debounce(()=>{
      if(ttsState.playing&&!ttsState.paused&&ttsState.bookId===book.id)return;
      const m = max();
      const p = m>0 ? Math.min(1, body.scrollTop/m) : (book.progress||0);
      book.progress = p;
      if(p>0.96){const wasFinished=book.status==='finished';book.status='finished';if(!wasFinished)celebrateBookFinished(book);}
      else if(book.status!=='finished') book.status='reading';
      saveBookDebounced(book);
      applyProgressUI(p);
    }, 200);
  }

  function clearPagedHandlers(){
    if(pagedKeyHandler){ document.removeEventListener('keydown', pagedKeyHandler); pagedKeyHandler=null; }
    if(pagedResizeHandler){ window.removeEventListener('resize', pagedResizeHandler); pagedResizeHandler=null; }
  }

  function buildPagesFromChapters(chapters, pageContentEl){
    const availableHeight=Math.max(180,pageContentEl.clientHeight||window.innerHeight-190);
    const availableWidth=Math.max(220,pageContentEl.clientWidth||window.innerWidth-36);
    const cs=getComputedStyle(pageContentEl);
    const measurer=document.createElement('div');
    Object.assign(measurer.style,{
      position:'fixed',visibility:'hidden',pointerEvents:'none',left:'-10000px',top:'0',
      width:availableWidth+'px',height:availableHeight+'px',overflow:'hidden',boxSizing:'border-box',
      paddingTop:cs.paddingTop,paddingRight:cs.paddingRight,paddingBottom:cs.paddingBottom,paddingLeft:cs.paddingLeft,
      fontFamily:cs.fontFamily,fontSize:cs.fontSize,lineHeight:cs.lineHeight,fontWeight:cs.fontWeight,
      letterSpacing:cs.letterSpacing,wordBreak:cs.wordBreak,overflowWrap:'anywhere'
    });
    document.body.appendChild(measurer);
    const tooTall=html=>{
      measurer.innerHTML=html||'';
      return measurer.scrollHeight>measurer.clientHeight+2;
    };
    const pages=[];
    let current=[];
    const flush=()=>{ if(current.length){ pages.push(current.join('')); current=[]; } };
    const addBlock=(html,plain)=>{
      plain=(plain||'').replace(/\s+/g,' ').trim();
      if(!plain && !html) return;
      if(!tooTall(current.join('')+html)){ current.push(html); return; }
      if(current.length) flush();
      if(!tooTall(html)){ current.push(html); return; }
      // Split a paragraph that exceeds a page by sentence, then by word.
      const sentences=plain.match(/[^.!?]+[.!?]*\s*/g)||[plain];
      let chunk='';
      const addTextChunk=text=>{
        const escaped='<p>'+escapeHtml(text.trim())+'</p>';
        if(!text.trim()) return;
        if(tooTall(escaped) && text.trim().length>1){
          let wordChunk='';
          const words=text.trim().split(/\s+/);
          for(const word of words){
            const candidate=wordChunk?wordChunk+' '+word:word;
            if(tooTall('<p>'+escapeHtml(candidate)+'</p>') && wordChunk){
              current.push('<p>'+escapeHtml(wordChunk)+'</p>'); flush(); wordChunk=word;
            } else if(tooTall('<p>'+escapeHtml(candidate)+'</p>') && !wordChunk){
              let fragment='';
              for(const char of word){
                const next=fragment+char;
                if(tooTall('<p>'+escapeHtml(next)+'</p>') && fragment){ current.push('<p>'+escapeHtml(fragment)+'</p>'); flush(); fragment=char; }
                else fragment=next;
              }
              if(fragment){ current.push('<p>'+escapeHtml(fragment)+'</p>'); flush(); }
            } else wordChunk=candidate;
          }
          if(wordChunk) current.push('<p>'+escapeHtml(wordChunk)+'</p>');
        } else {
          const fragment='<p>'+escapeHtml(text.trim())+'</p>';
          if(tooTall(current.join('')+fragment) && current.length) flush();
          current.push(fragment);
        }
      };
      for(const sentence of sentences){
        const candidate=chunk+sentence;
        if(tooTall('<p>'+escapeHtml(candidate.trim())+'</p>') && chunk){ addTextChunk(chunk); chunk=sentence; }
        else chunk=candidate;
      }
      if(chunk) addTextChunk(chunk);
    };
    const blockTags=new Set(['p','h1','h2','h3','h4','h5','h6','blockquote','pre','li','table','hr']);
    (chapters||[]).forEach(chHtml=>{
      const doc=new DOMParser().parseFromString(chHtml||'','text/html');
      doc.querySelectorAll('script,style,iframe,object,embed').forEach(el=>el.remove());
      const collect=node=>{
        if(node.nodeType===Node.TEXT_NODE){
          const text=node.textContent.trim(); if(text) addBlock('<p>'+escapeHtml(text)+'</p>',text);
          return;
        }
        if(node.nodeType!==Node.ELEMENT_NODE) return;
        const tag=node.tagName.toLowerCase();
        if(tag==='div'||tag==='section'||tag==='article'||tag==='body'){
          const hasBlocks=[...node.children].some(el=>blockTags.has(el.tagName.toLowerCase())||['div','section','article'].includes(el.tagName.toLowerCase()));
          if(hasBlocks){ [...node.childNodes].forEach(collect); return; }
        }
        if(tag==='ul'||tag==='ol'){
          [...node.children].forEach(li=>{
            const text=(li.textContent||'').trim();
            if(text) addBlock('<p>• '+escapeHtml(text)+'</p>',text);
          });
          return;
        }
        const text=(node.textContent||'').trim();
        if(!text && tag!=='hr') return;
        const html=blockTags.has(tag)?node.outerHTML:'<p>'+node.innerHTML+'</p>';
        addBlock(html,text);
      };
      [...doc.body.childNodes].forEach(collect);
    });
    flush();
    measurer.remove();
    return pages.length?pages.map(html=>({html} )):[{html:'<p><i>Sem conteúdo.</i></p>'}];
  }

  function renderPaged(book, body){
    clearPagedHandlers();
    body.classList.add('page-mode');
    body.onscroll=null;
    const anim=settings.pageAnim||'curl';
    const animMs={curl:550,flip:420,slide:350,fade:280}[anim]||420;
    const midMs=Math.round(animMs*.4);
    body.innerHTML=`
      <div class="reader-paged page-anim-${anim}">
        <div class="page-flip-wrap"><div class="page-content" id="pageContent" aria-live="polite"></div></div>
        <div class="page-nav" role="group" aria-label="Navegação do livro. A posição atual é salva automaticamente.">
          <div class="page-nav-main">
            <button class="btn small" id="pagePrev" type="button" aria-label="Página anterior">← Anterior</button>
            <span class="muted page-label" id="pageLabel" aria-live="polite">…</span>
            <button class="btn small" id="pageNext" type="button" aria-label="Próxima página">Próxima →</button>
          </div>
          <form class="page-jump-tools" id="pageJumpForm" autocomplete="off">
            <button class="btn small page-home-btn" id="pageHome" type="button" title="Voltar ao início do livro">Início</button>
            <input id="pageJumpInput" type="text" inputmode="numeric" enterkeyhint="go" autocomplete="off" aria-label="Número da página" placeholder="Nº página">
            <button class="btn small" id="pageJumpBtn" type="submit" aria-label="Ir para a página escolhida">Ir</button>
          </form>
        </div>
      </div>`;
    const pageEl=$('#pageContent');
    const pages=buildPagesFromChapters(book.chapters||[],pageEl);
    const pageWordCounts=pages.map(p=>countAudioWordsInHtml(p.html));
    const pageWordStarts=[];let wordTotal=0;pageWordCounts.forEach(n=>{pageWordStarts.push(wordTotal);wordTotal+=n;});
    let pageIdx=Math.min(pages.length-1,Math.max(0,Math.round((book.progress||0)*(pages.length-1))));
    if(Number.isInteger(book.lastPageIndex)&&Number.isInteger(book.lastPageCount)&&book.lastPageCount>0){
      if(book.lastPageCount===pages.length)pageIdx=Math.max(0,Math.min(pages.length-1,book.lastPageIndex));
      else if(book.lastPageCount>1)pageIdx=Math.min(pages.length-1,Math.max(0,Math.round((book.lastPageIndex/(book.lastPageCount-1))*Math.max(0,pages.length-1))));
    }
    pagedState={pages,pageIdx,bookId:book.id,pageWordStarts,pageWordCounts,pageForWord:null,goToAudioPage:null,pageJumpEditing:false};
    let animating=false;
    const reduced=prefersReducedMotion();
    const show=()=>{
      const el=$('#pageContent'); if(!el) return;
      el.innerHTML=pages[pageIdx].html; el.scrollTop=0;
      const prev=$('#pagePrev'),next=$('#pageNext'),lab=$('#pageLabel');
      if(prev) prev.disabled=pageIdx<=0||animating;
      if(next) next.disabled=pageIdx>=pages.length-1||animating;
      if(lab) lab.textContent=(pageIdx+1)+' / '+pages.length;
      const jumpInput=$('#pageJumpInput');if(jumpInput){jumpInput.maxLength=String(pages.length).length;if(document.activeElement!==jumpInput&&!(pagedState&&pagedState.pageJumpEditing))jumpInput.value=String(pageIdx+1);}
      if(ttsState.playing&&ttsState.bookId===book.id){
        decorateAudioWords(el,pageWordStarts[pageIdx]||0,ttsState.currentChunkStartWord,ttsState.currentChunkEndWord);
        if(ttsState.currentWordIndex>=0)paintAudioWord(el,ttsState.currentWordIndex,true);
      }
      if(pagedState&&pagedState.bookId===book.id)pagedState.pageIdx=pageIdx;
    };
    const updateProgress=(navigated=false,manual=true)=>{
      const wasFinished=book.status==='finished';
      book.progress=pages.length>1?pageIdx/(pages.length-1):(navigated?1:(book.progress||0));
      book.lastPageIndex=pageIdx;book.lastPageCount=pages.length;
      if(navigated&&manual&&pageIdx>=pages.length-1){book.status='finished';if(!wasFinished)celebrateBookFinished(book);}
      else if(pageIdx<pages.length-1) book.status='reading';
      saveBookDebounced(book); pagedState.pageIdx=pageIdx;
    };
    const saveAudioPagePosition=()=>{book.lastPageIndex=pageIdx;book.lastPageCount=pages.length;pagedState.pageIdx=pageIdx;saveBookDebounced(book);};
    const pauseForManualPageChange=()=>{if(ttsState.playing&&!ttsState.paused&&ttsState.bookId===book.id){try{speechSynthesis.pause();}catch(e){}ttsState.paused=true;reanchorAudioFallback();updateAudioUI();}};
    const pageForAudioWord=wordIndex=>{
      const starts=(pagedState&&pagedState.bookId===book.id&&pagedState.pageWordStarts)||pageWordStarts;
      const counts=(pagedState&&pagedState.bookId===book.id&&pagedState.pageWordCounts)||pageWordCounts;
      let lo=0,hi=pages.length-1,last=0;
      while(lo<=hi){
        const mid=(lo+hi)>>1,start=starts[mid]||0,end=start+(counts[mid]||0);
        if(wordIndex<start)hi=mid-1;
        else if(wordIndex>=end){last=mid;lo=mid+1;}
        else return mid;
      }
      return Math.max(0,Math.min(pages.length-1,last));
    };
    let pendingAudioPage=null,pendingManualJump=null;
    const goToAudioPage=target=>{
      if(!ttsState.playing||ttsState.paused||ttsState.bookId!==book.id)return;
      target=Math.max(0,Math.min(pages.length-1,target));if(target===pageIdx)return;
      if(animating){pendingAudioPage=target;return;}
      if(Math.abs(target-pageIdx)>1){pageIdx=target;saveAudioPagePosition();show();const el=$('#pageContent');if(el&&!reduced){el.classList.remove('page-jump-enter');void el.offsetWidth;el.classList.add('page-jump-enter');setTimeout(()=>{if(el.isConnected)el.classList.remove('page-jump-enter');},240);}return;}
      go(target>pageIdx?1:-1,true);
      if(!animating&&pageIdx!==target)goToAudioPage(target);
      else if(pageIdx!==target)pendingAudioPage=target;
    };
    const go=(dir,fromAudio=false)=>{
      if(animating) return;
      const nextIdx=pageIdx+dir;
      if(nextIdx<0||nextIdx>=pages.length) return;
      if(!fromAudio)pauseForManualPageChange();
      if(reduced||anim==='none'){ pageIdx=nextIdx;if(fromAudio)saveAudioPagePosition();else updateProgress(true);show();return;}
      animating=true;
      const el=$('#pageContent'); if(!el){animating=false;return;}
      const outCls=dir>0?'flip-out-next':'flip-out-prev';
      const inCls=dir>0?'flip-in-next':'flip-in-prev';
      el.classList.remove('flip-out-next','flip-out-prev','flip-in-next','flip-in-prev');
      void el.offsetWidth; el.classList.add(outCls);
      try{playSoftWhoosh();}catch(e){}
      setTimeout(()=>{
        if(!el.isConnected) return;
        if(fromAudio&&(!ttsState.playing||ttsState.paused||ttsState.bookId!==book.id)){animating=false;pendingAudioPage=null;el.classList.remove(outCls);const queuedJump=pendingManualJump;pendingManualJump=null;if(queuedJump!==null)jumpToPage(queuedJump);return;}
        pageIdx=nextIdx;if(fromAudio)saveAudioPagePosition();else updateProgress(true);el.classList.remove(outCls);el.innerHTML=pages[pageIdx].html;el.scrollTop=0;void el.offsetWidth;el.classList.add(inCls);
        setTimeout(()=>{if(!el.isConnected)return;el.classList.remove(inCls);animating=false;show();const queuedJump=pendingManualJump;pendingManualJump=null;if(queuedJump!==null){jumpToPage(queuedJump);return;}const queued=pendingAudioPage;pendingAudioPage=null;if(queued!==null&&queued!==pageIdx)goToAudioPage(queued);},animMs);
      },midMs);
    };
    const jumpToPage=target=>{
      if(!Number.isInteger(target))return;
      target=Math.max(0,Math.min(pages.length-1,target));pendingAudioPage=null;
      if(target!==pageIdx)pauseForManualPageChange();
      if(animating){pendingManualJump=target;return;}
      pendingManualJump=null;
      if(target===pageIdx){const input=$('#pageJumpInput');if(input)input.value=String(pageIdx+1);return;}
      pageIdx=target;updateProgress(true,false);show();
      const el=$('#pageContent');if(el&&!reduced){el.classList.remove('page-jump-enter');void el.offsetWidth;el.classList.add('page-jump-enter');setTimeout(()=>{if(el.isConnected)el.classList.remove('page-jump-enter');},240);}
    };
    const submitPageJump=()=>{
      const input=$('#pageJumpInput'),raw=input?input.value.trim():'';
      const value=/^\d+$/.test(raw)?Number(raw):NaN;
      if(!Number.isInteger(value)||value<1||value>pages.length){toast('Digite um número inteiro entre 1 e '+pages.length+'.');if(input){pagedState.pageJumpEditing=true;input.focus();input.select();}return;}
      if(pagedState&&pagedState.bookId===book.id)pagedState.pageJumpEditing=false;
      jumpToPage(value-1);if(input)input.blur();
    };
    pagedState={pages,pageIdx,bookId:book.id,pageWordStarts,pageWordCounts,pageForWord:pageForAudioWord,goToAudioPage,pageJumpEditing:false};
    $('#pagePrev').addEventListener('click',()=>go(-1));
    $('#pageNext').addEventListener('click',()=>go(1));
    $('#pageHome').addEventListener('click',()=>jumpToPage(0));
    const pageJumpInput=$('#pageJumpInput'),pageJumpForm=$('#pageJumpForm');
    pageJumpInput.addEventListener('focus',()=>{if(pagedState&&pagedState.bookId===book.id)pagedState.pageJumpEditing=true;});
    pageJumpInput.addEventListener('input',()=>{
      if(pagedState&&pagedState.bookId===book.id)pagedState.pageJumpEditing=true;
      const clean=pageJumpInput.value.replace(/[^0-9]/g,'').slice(0,String(pages.length).length);
      if(clean!==pageJumpInput.value)pageJumpInput.value=clean;
    });
    pageJumpInput.addEventListener('blur',()=>setTimeout(()=>{
      if(document.activeElement!==$('#pageJumpBtn')&&pagedState&&pagedState.bookId===book.id&&pagedState.pageJumpEditing){pagedState.pageJumpEditing=false;const input=$('#pageJumpInput');if(input)input.value=String(pageIdx+1);}
      setTimeout(()=>{if(body.isConnected&&activeReaderBookId===book.id)pagedResizeHandler();},320);
    },180));
    pageJumpForm.addEventListener('submit',e=>{e.preventDefault();submitPageJump();});
    pagedKeyHandler=e=>{
      if(!$('#readerBody .reader-paged')||(e.target&&e.target.closest&&e.target.closest('.modal'))) return;
      if(e.target&&e.target.matches&&e.target.matches('input,textarea,select,button')) return;
      if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(1);}
      else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(-1);}
      else if(e.key==='Home'){e.preventDefault();jumpToPage(0);}
      else if(e.key==='End'){e.preventDefault();jumpToPage(pages.length-1);}
    };
    document.addEventListener('keydown',pagedKeyHandler);
    let touchStart=null;
    const wrap=$('.page-flip-wrap');
    wrap.addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchStart={x:t.clientX,y:t.clientY};},{passive:true});
    wrap.addEventListener('touchend',e=>{
      if(!touchStart)return;
      const t=e.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;touchStart=null;
      if(Math.abs(dx)>52&&Math.abs(dx)>Math.abs(dy)*1.25) go(dx<0?1:-1);
    },{passive:true});
    pagedResizeHandler=debounce(()=>{
      if(pagedState&&pagedState.bookId===book.id&&pagedState.pageJumpEditing)return;
      if(document.activeElement===$('#pageJumpInput'))return;
      if(body.isConnected&&body.classList.contains('page-mode')&&activeReaderBookId===book.id)renderPaged(book,body);
    },220);
    window.addEventListener('resize',pagedResizeHandler);
    show();updateProgress();
  }

  async function renderComicReader(book, body){
    let zip = readerZipCache[book.id];
    if(!zip){
      try{ zip = await JSZip.loadAsync(book.fileBlob); readerZipCache[book.id]=zip; }
      catch(e){ body.innerHTML='<div class="empty" style="margin:30px;">Não foi possível abrir este arquivo de quadrinhos.</div>'; return; }
    }
    const pages = book.comicPages||[];
    if(!pages.length){ body.innerHTML='<div class="empty" style="margin:30px;">Nenhuma página encontrada neste arquivo.</div>'; return; }
    let idx = Number.isInteger(book.lastComicPage)&&book.lastComicCount===pages.length?Math.max(0,Math.min(pages.length-1,book.lastComicPage)):(Math.round((book.progress||0) * (pages.length-1)) || 0);
    let renderId=0;
    async function showPage(i,finishIfLast=true){
      idx = Math.max(0, Math.min(pages.length-1, i));
      const thisRender=++renderId,pageIndex=idx,file=zip.file(pages[pageIndex]);
      if(!file){toast('Não foi possível abrir esta página.');return;}
      const b64 = await file.async('base64');if(thisRender!==renderId)return;
      const ext = pages[pageIndex].split('.').pop();
      body.innerHTML = `<div class="comic-reader-layout"><div class="comic-view"><img src="data:${mimeFromExt(ext)};base64,${b64}" alt="Página ${pageIndex+1}"><button class="comic-tap left" aria-label="Página anterior"></button><button class="comic-tap right" aria-label="Próxima página"></button></div><div class="comic-page-controls" role="group" aria-label="Navegação do quadrinho. A posição atual é salva automaticamente."><div class="comic-nav-main"><button class="btn small" id="comicPrev" type="button" aria-label="Página anterior">← Anterior</button><span class="comic-page-label" id="comicPageLabel" aria-live="polite">${pageIndex+1} / ${pages.length}</span><button class="btn small" id="comicNext" type="button" aria-label="Próxima página">Próxima →</button></div><form class="comic-page-jump" id="comicJumpForm" autocomplete="off"><button class="btn small page-home-btn" id="comicHome" type="button" title="Voltar ao início do quadrinho">Início</button><input id="comicJumpInput" type="text" value="${pageIndex+1}" inputmode="numeric" enterkeyhint="go" autocomplete="off" maxlength="${String(pages.length).length}" aria-label="Número da página" placeholder="Nº página"><button class="btn small" id="comicJumpBtn" type="submit" aria-label="Ir para a página escolhida">Ir</button></form></div></div>`;
      $('.comic-tap.left').addEventListener('click', ()=> showPage(idx-1,true));
      $('.comic-tap.right').addEventListener('click', ()=> showPage(idx+1,true));
      $('#comicPrev').addEventListener('click',()=>showPage(idx-1,true));
      $('#comicNext').addEventListener('click',()=>showPage(idx+1,true));
      $('#comicHome').addEventListener('click',()=>showPage(0,false));
      const comicJumpInput=$('#comicJumpInput'),comicJumpForm=$('#comicJumpForm');
      const submitJump=()=>{const raw=comicJumpInput?comicJumpInput.value.trim():'',target=/^\d+$/.test(raw)?Number(raw):NaN;if(!Number.isInteger(target)||target<1||target>pages.length){toast('Digite um número inteiro entre 1 e '+pages.length+'.');if(comicJumpInput){comicJumpInput.focus();comicJumpInput.select();}return;}showPage(target-1,false);if(comicJumpInput)comicJumpInput.blur();};
      comicJumpInput.addEventListener('input',()=>{const clean=comicJumpInput.value.replace(/[^0-9]/g,'').slice(0,String(pages.length).length);if(clean!==comicJumpInput.value)comicJumpInput.value=clean;});
      comicJumpForm.addEventListener('submit',e=>{e.preventDefault();submitJump();});
      book.progress = pages.length>1 ? pageIndex/(pages.length-1) : 1;
      book.lastComicPage=pageIndex;book.lastComicCount=pages.length;
      const wasFinished=book.status==='finished';
      if(finishIfLast&&pageIndex>=pages.length-1){book.status='finished';if(!wasFinished)celebrateBookFinished(book);}
      else if(!wasFinished)book.status='reading';
      saveBookDebounced(book);
      const label = $('#readerProgressLabel'), fill = $('#readerProgressFill');
      if(label) label.textContent = (pageIndex+1)+' / '+pages.length;
      if(fill) fill.style.width = Math.round((book.progress||0)*100)+'%';
    }
    showPage(idx,false);
  }

  /* ---------- Global nav ---------- */
  try{
    $$('.nav-btn').forEach(b=> b.addEventListener('click', ()=> setView(b.dataset.nav)));
    const bi = $('#btnImport'); if(bi) bi.addEventListener('click', openImportModal);
    const bs = $('#btnSettings'); if(bs) bs.addEventListener('click', openSettingsModal);
  }catch(e){ console.error(e); }

  // Preload speech voices (online + local) as early as possible
  if(window.speechSynthesis){
    try{ speechSynthesis.getVoices(); }catch(e){}
    speechSynthesis.addEventListener('voiceschanged', ()=>{ try{ speechSynthesis.getVoices(); }catch(e){} });
  }

  // Save time when leaving page
  const persistActiveReader=()=>{const b=books.find(x=>x.id===activeReaderBookId);if(b)saveBook(b);};
  window.addEventListener('beforeunload', ()=>{stopReadingSession();persistActiveReader();});
  window.addEventListener('pagehide', ()=>{stopReadingSession();persistActiveReader();});
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){ stopReadingSession();persistActiveReader();releaseScreenWakeLock(); }
    else if($('#readerRoot').innerHTML && activeReaderBookId){
      startReadingSession(activeReaderBookId);
      if(settings.keepScreenOn) requestScreenWakeLock(false);
    }
  });

})();
</script>
</body>
</html>
