<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#20392f">
<title>Estante Pró — sua biblioteca pessoal</title>
<style>
@charset "utf-8";
:root{
  --bg:#f6f2e9; --surface:#ffffff; --surface2:#efe9db; --surface3:#e6dfcd;
  --ink:#1e2b24; --muted:#71806f; --line:#e4ddcc;
  --primary:#20392f; --primary-light:#356452; --primary-dark:#122019;
  --accent:#d98a4a; --accent-dark:#b9682e; --accent-soft:#f3ddc2;
  --blue:#4c6a97; --danger:#c1503a; --gold:#c99a3a;
  --radius-xl:28px; --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
  --shadow-sm:0 2px 8px rgba(20,30,24,.06);
  --shadow-md:0 10px 26px rgba(20,30,24,.10);
  --shadow-lg:0 22px 48px rgba(20,30,24,.16);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"Cascadia Code",Menlo,Consolas,monospace;
  --dyslexic:"Comic Sans MS","OpenDyslexic",var(--sans);
  --georgia:Georgia,"Times New Roman",serif;
  --verdana:Verdana,Geneva,sans-serif;
  --tahoma:Tahoma,Geneva,sans-serif;
}
[data-app-theme="dark"]{
  --bg:#131a16; --surface:#1b2521; --surface2:#222e28; --surface3:#2b3931;
  --ink:#eef1ec; --muted:#93a397; --line:#2c3931;
  --shadow-sm:0 2px 10px rgba(0,0,0,.3); --shadow-md:0 12px 30px rgba(0,0,0,.38); --shadow-lg:0 26px 54px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent;}
button,input,select,textarea{font:inherit;color:inherit;}
button{border:0;background:none;cursor:pointer;}
::selection{background:var(--accent-soft);}
img{max-width:100%;display:block;}
.app{max-width:1180px;margin:0 auto;padding:16px 20px 100px;min-height:100vh;}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:10px 0 16px;background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(14px);}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.01em;}
.brand-mark{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(150deg,var(--accent),var(--accent-dark));color:#fff;font-size:18px;box-shadow:var(--shadow-sm);}
.top-actions{display:flex;gap:8px;}
.icon-btn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:18px;box-shadow:var(--shadow-sm);transition:transform .18s ease,box-shadow .18s ease,background .18s,border-color .18s;color:var(--ink);}
.icon-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:color-mix(in srgb,var(--accent) 40%,var(--line));background:color-mix(in srgb,var(--surface) 90%,var(--accent-soft));}
.icon-btn:active{transform:scale(.94);}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.icon-btn.accent{background:linear-gradient(145deg,var(--accent),var(--accent-dark));color:#fff;border-color:transparent;}
.icon-btn.accent:hover{background:linear-gradient(145deg,var(--accent-dark),var(--accent));color:#fff;}
.btn{border-radius:14px;padding:12px 18px;font-weight:700;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);transition:transform .18s ease,box-shadow .18s ease,opacity .15s,background .18s,border-color .18s;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.btn:active{transform:scale(.96);}
.btn.primary{background:linear-gradient(150deg,var(--accent),var(--accent-dark));color:#fff;border-color:transparent;}
.btn.primary:hover{filter:brightness(1.05);}
.btn.dark{background:linear-gradient(150deg,var(--primary-light),var(--primary));color:#fff;border-color:transparent;}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent;}
.btn.ghost{background:transparent;box-shadow:none;}
.btn.small{padding:8px 13px;font-size:13px;border-radius:11px;}
.btn.block{width:100%;justify-content:center;}
.btn[disabled]{opacity:.45;pointer-events:none;}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.btn .btn-ic{font-size:15px;line-height:1;}
.eyebrow{text-transform:uppercase;letter-spacing:.11em;font-size:11.5px;font-weight:800;color:var(--muted);}
.muted{color:var(--muted);}
h1,h2,h3{margin:0;font-family:var(--serif);}
.page-title{font-size:clamp(28px,5vw,42px);line-height:1.05;letter-spacing:-.02em;margin:6px 0 4px;}
.hero{display:grid;grid-template-columns:1.5fr .9fr;gap:14px;margin:22px 0 26px;}
.hero-main{border-radius:var(--radius-xl);padding:30px;background:radial-gradient(120% 140% at 10% 0%,var(--primary-light),var(--primary) 55%,var(--primary-dark));color:#fff;min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:12px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;}
.hero-main::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%);}
.hero-main h2{font-size:clamp(22px,3vw,30px);line-height:1.15;max-width:20ch;}
.hero-main p{margin:0;max-width:34ch;color:rgba(255,255,255,.82);font-size:14.5px;}
.hero-side{border-radius:var(--radius-xl);background:var(--surface);border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow-md);}
.hero-side strong{font-size:40px;font-family:var(--serif);}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:26px;}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-sm);}
.stat-card strong{display:block;font-family:var(--serif);font-size:24px;}
.stat-card span{font-size:12.5px;}
.section{margin-top:30px;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
.section-head h2{font-size:19px;}
.shelves-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
.shelf-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm);transition:transform .15s,box-shadow .15s;text-align:left;}
.shelf-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.shelf-icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--surface2);flex:none;}
.shelf-card b{display:block;font-size:14.5px;}
.shelf-card .muted{font-size:12.5px;}
.shelf-card.add{border:2px dashed var(--line);background:transparent;box-shadow:none;justify-content:center;color:var(--muted);font-weight:700;}
.books-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px 16px;}
.book{cursor:pointer;position:relative;}
.book .cover-wrap{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 12px 24px rgba(20,30,24,.16);aspect-ratio:.68/1;transition:transform .18s ease,box-shadow .18s ease;background:var(--surface2);}
.book:hover .cover-wrap{transform:translateY(-5px);box-shadow:0 20px 36px rgba(20,30,24,.24);}
.book:active .cover-wrap{transform:translateY(-1px) scale(.98);}
.cover-wrap img{width:100%;height:100%;object-fit:cover;}
.cover-fallback{width:100%;height:100%;padding:14px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;}
.cover-fallback.g0{background:linear-gradient(160deg,#356452,#122019);}
.cover-fallback.g1{background:linear-gradient(160deg,#c98a5b,#6e3a2c);}
.cover-fallback.g2{background:linear-gradient(160deg,#5b74a6,#242c52);}
.cover-fallback strong{font:700 16px/1.15 var(--serif);}
.cover-fallback small{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;}
.fmt-badge{position:absolute;top:8px;left:8px;background:rgba(15,20,17,.55);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.06em;padding:3px 7px;border-radius:7px;backdrop-filter:blur(3px);}
.fav-badge{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;background:rgba(15,20,17,.5);display:grid;place-items:center;color:#fff;font-size:13px;backdrop-filter:blur(3px);}
.sel-badge{position:absolute;inset:0;border-radius:16px;border:3px solid var(--accent);background:rgba(217,138,74,.18);display:none;place-items:center;}
.sel-badge span{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;}
.book.selected .sel-badge{display:grid;}
.book-progress{height:4px;border-radius:4px;background:var(--surface3);margin-top:9px;overflow:hidden;}
.book-progress i{display:block;height:100%;background:var(--accent);}
.book-info{padding:9px 1px 0;}
.book-title{font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.book-author{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.toolbar{display:flex;gap:10px;margin:20px 0 18px;flex-wrap:wrap;}
.search-box{flex:1 1 220px;position:relative;}
.search-box input{width:100%;padding:12px 14px 12px 40px;border-radius:14px;border:1px solid var(--line);background:var(--surface);outline:0;box-shadow:var(--shadow-sm);}
.search-box input:focus{border-color:var(--accent);}
.search-box .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{padding:9px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted);}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}
.chip.selectable{cursor:pointer;}
.chip.selectable.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.select-toolbar{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--surface2);border-radius:14px;padding:10px 14px;margin-bottom:16px;font-size:13.5px;font-weight:700;}
.empty{padding:44px 20px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--radius-xl);color:var(--muted);}
.empty b{display:block;color:var(--ink);font-family:var(--serif);font-size:19px;margin-bottom:6px;font-weight:700;}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(94%,760px);display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb, var(--surface) 96%, transparent);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:9px 6px calc(9px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(20,30,24,.12);backdrop-filter:blur(16px);z-index:25;}
.nav-btn{padding:8px 4px;border-radius:14px;text-align:center;font-size:10.5px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;transition:background .2s,color .2s,transform .15s;}
.nav-btn .ic{width:24px;height:24px;display:grid;place-items:center;}
.nav-btn .ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.nav-btn:hover{color:var(--primary);transform:translateY(-1px);}
.nav-btn.active{background:var(--surface2);color:var(--primary);}
.nav-btn.active .ic svg{stroke-width:2.2;}
[data-app-theme="dark"] .nav-btn.active{color:var(--accent);}
[data-app-theme="dark"] .nav-btn:hover{color:var(--accent);}

/* Audio player */
.audio-bar{
  position:absolute;bottom:0;left:0;right:0;z-index:10;
  padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));
  pointer-events:none;
}
.audio-bar-card{
  pointer-events:auto;
  max-width:520px;margin:0 auto;
  background:color-mix(in srgb, var(--reader-surface,var(--surface)) 92%, transparent);
  backdrop-filter:blur(18px) saturate(1.2);
  -webkit-backdrop-filter:blur(18px) saturate(1.2);
  border:1px solid color-mix(in srgb, var(--line) 80%, transparent);
  border-radius:22px;
  padding:14px 16px 16px;
  box-shadow:0 12px 40px rgba(20,30,24,.18), 0 2px 8px rgba(20,30,24,.06);
  animation:audioIn .28s cubic-bezier(.2,.8,.2,1);
}
@keyframes audioIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
[data-app-theme="dark"] .audio-bar-card{
  background:color-mix(in srgb, var(--reader-surface,var(--surface)) 88%, transparent);
  box-shadow:0 16px 48px rgba(0,0,0,.45);
}
.audio-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.audio-icon{
  width:42px;height:42px;border-radius:14px;flex:none;
  background:linear-gradient(145deg,var(--accent),var(--accent-dark));
  color:#fff;display:grid;place-items:center;
  box-shadow:0 4px 14px rgba(217,138,74,.3);
  position:relative;overflow:hidden;
}
.audio-icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:1;}
.audio-icon.playing::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.25),transparent 70%);
  animation:audioPulse 1.6s ease-in-out infinite;
}
@keyframes audioPulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.9;transform:scale(1.15)}}
.audio-info{flex:1;min-width:0;}
.audio-title{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);letter-spacing:-.01em;}
.audio-status{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px;}
.audio-status-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none;}
.audio-status-dot.on{background:#3dba6e;box-shadow:0 0 0 3px rgba(61,186,110,.2);animation:dotPulse 1.4s ease infinite;}
.audio-status-dot.pause{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
@keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.5}}
.audio-close-btn{
  width:32px;height:32px;border-radius:10px;flex:none;
  display:grid;place-items:center;color:var(--muted);
  background:var(--surface2);border:1px solid var(--line);
  transition:background .15s,color .15s,transform .15s;
}
.audio-close-btn:hover{background:var(--surface3);color:var(--ink);transform:rotate(90deg);}
.audio-close-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;}
.audio-progress-wrap{margin-bottom:14px;}
.audio-progress{
  height:5px;border-radius:5px;background:var(--surface3);
  overflow:hidden;cursor:pointer;position:relative;
}
.audio-progress:hover{height:7px;margin:-1px 0;}
.audio-progress i{
  display:block;height:100%;width:0%;border-radius:5px;
  background:linear-gradient(90deg,var(--accent),var(--accent-dark));
  transition:width .2s linear;
  position:relative;
}
.audio-progress i::after{
  content:"";position:absolute;right:-5px;top:50%;transform:translateY(-50%);
  width:11px;height:11px;border-radius:50%;background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.25);opacity:0;transition:opacity .15s;
}
.audio-progress:hover i::after{opacity:1;}
.audio-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:600;margin-top:6px;}
.audio-controls{display:flex;align-items:center;justify-content:center;gap:10px;}
.audio-btn{
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:var(--surface2);border:1px solid var(--line);
  color:var(--ink);transition:transform .15s,background .15s,box-shadow .15s,border-color .15s;
}
.audio-btn:hover{background:var(--surface3);transform:scale(1.06);border-color:color-mix(in srgb,var(--accent) 30%,var(--line));}
.audio-btn:active{transform:scale(.94);}
.audio-btn.play{
  width:56px;height:56px;
  background:linear-gradient(145deg,var(--accent),var(--accent-dark));
  color:#fff;border:none;
  box-shadow:0 6px 20px rgba(217,138,74,.4);
}
.audio-btn.play:hover{filter:brightness(1.08);transform:scale(1.06);box-shadow:0 8px 24px rgba(217,138,74,.5);}
.audio-btn.play.is-playing{box-shadow:0 0 0 4px var(--accent-soft), 0 6px 20px rgba(217,138,74,.4);}
.audio-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.audio-btn.play svg{width:22px;height:22px;}
.audio-btn svg[fill="currentColor"],.icon-btn svg[fill="currentColor"],.btn svg[fill="currentColor"]{fill:currentColor;stroke:none;}
.audio-speed{
  font-size:12.5px;font-weight:800;padding:0;min-width:44px;height:44px;
  border-radius:50%;background:var(--surface2);border:1px solid var(--line);
  color:var(--ink);display:grid;place-items:center;
  transition:background .15s,border-color .15s,transform .15s,color .15s;
}
.audio-speed:hover{border-color:var(--accent);color:var(--accent-dark);transform:scale(1.06);}
.audio-speed:active{transform:scale(.94);}
.audio-wave{display:flex;align-items:center;gap:2px;height:14px;opacity:0;transition:opacity .2s;}
.audio-wave.on{opacity:1;}
.audio-wave span{
  width:2.5px;border-radius:2px;background:var(--accent);
  animation:waveBar 0.9s ease-in-out infinite;
}
.audio-wave span:nth-child(1){height:40%;animation-delay:0s}
.audio-wave span:nth-child(2){height:70%;animation-delay:.12s}
.audio-wave span:nth-child(3){height:100%;animation-delay:.24s}
.audio-wave span:nth-child(4){height:55%;animation-delay:.36s}
.audio-wave span:nth-child(5){height:80%;animation-delay:.48s}
@keyframes waveBar{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
.reader-body.has-audio{padding-bottom:160px;}
@media (max-width:520px){
  .audio-bar{padding:0 10px calc(8px + env(safe-area-inset-bottom,0px));}
  .audio-bar-card{padding:12px 14px 14px;border-radius:18px;}
  .audio-btn{width:40px;height:40px;}
  .audio-btn.play{width:52px;height:52px;}
  .audio-speed{min-width:40px;height:40px;font-size:12px;}
  .reader-body.has-audio{padding-bottom:150px;}
}

/* Mini player global (biblioteca) */
.mini-player{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(72px + env(safe-area-inset-bottom,0px));
  width:min(94%,700px);z-index:28;
  display:none;animation:audioIn .25s cubic-bezier(.2,.8,.2,1);
}
.mini-player.show{display:block;}
.mini-player-card{
  display:flex;align-items:center;gap:12px;
  background:color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter:blur(16px) saturate(1.15);
  -webkit-backdrop-filter:blur(16px) saturate(1.15);
  border:1px solid var(--line);border-radius:18px;
  padding:10px 12px 10px 10px;
  box-shadow:0 10px 32px rgba(20,30,24,.14);
}
[data-app-theme="dark"] .mini-player-card{box-shadow:0 12px 36px rgba(0,0,0,.4);}
.mini-cover{
  width:44px;height:44px;border-radius:11px;overflow:hidden;flex:none;
  background:linear-gradient(145deg,var(--primary-light),var(--primary));
  display:grid;place-items:center;color:#fff;font-size:18px;
  box-shadow:var(--shadow-sm);
}
.mini-cover img{width:100%;height:100%;object-fit:cover;}
.mini-info{flex:1;min-width:0;}
.mini-title{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-sub{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px;display:flex;align-items:center;gap:5px;}
.mini-actions{display:flex;align-items:center;gap:6px;flex:none;}
.mini-btn{
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  background:var(--surface2);border:1px solid var(--line);color:var(--ink);
  transition:transform .15s,background .15s;
}
.mini-btn:hover{background:var(--surface3);transform:scale(1.06);}
.mini-btn.play{
  width:40px;height:40px;
  background:linear-gradient(145deg,var(--accent),var(--accent-dark));
  color:#fff;border:none;box-shadow:0 4px 12px rgba(217,138,74,.35);
}
.mini-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.mini-btn svg[fill="currentColor"]{fill:currentColor;stroke:none;}
.mini-progress{position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:0 0 18px 18px;background:var(--surface3);overflow:hidden;}
.mini-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-dark));width:0%;transition:width .2s linear;}
.mini-player-card{position:relative;padding-bottom:12px;}
.app.has-mini{padding-bottom:160px;}
.book-audio-badge{
  position:absolute;bottom:8px;right:8px;
  width:24px;height:24px;border-radius:50%;
  background:rgba(15,20,17,.55);color:#fff;
  display:grid;place-items:center;font-size:11px;
  backdrop-filter:blur(3px);
}
.modal-bg{position:fixed;inset:0;background:rgba(10,16,13,.58);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:60;animation:fadein .15s ease;}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{width:min(100%,600px);max-height:92vh;overflow:auto;background:var(--surface);border-radius:26px;padding:0;box-shadow:var(--shadow-lg);}
.modal-head{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:20px 22px 14px;border-bottom:1px solid var(--line);z-index:2;}
.modal-head h3{font-size:19px;}
.modal-body{padding:20px 22px 26px;}
.close-x{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:15px;flex:none;transition:background .15s,transform .15s;color:var(--muted);}
.close-x:hover{background:var(--surface3);color:var(--ink);transform:rotate(90deg);}
.dropzone{border:2px dashed var(--primary-light);border-radius:20px;padding:30px 18px;text-align:center;cursor:pointer;background:var(--surface2);transition:background .15s;}
.dropzone:hover,.dropzone.drag{background:var(--accent-soft);}
.dropzone b{display:block;font-size:15px;margin-bottom:4px;}
.dropzone span{font-size:12.5px;color:var(--muted);}
.formats-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;}
.fmt-chip{background:var(--surface3);padding:5px 9px;border-radius:8px;font-size:10.5px;font-weight:800;letter-spacing:.03em;}
.file-list{margin-top:16px;max-height:230px;overflow:auto;border-radius:14px;}
.file-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;}
.file-row .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;}
.file-row .fstatus{font-size:11.5px;font-weight:800;flex:none;padding:4px 9px;border-radius:8px;background:var(--surface2);color:var(--muted);}
.file-row .fstatus.ok{background:#e3f1e6;color:#2c6b3f;}
.file-row .fstatus.err{background:#fbe4de;color:var(--danger);}
[data-app-theme="dark"] .file-row .fstatus.ok{background:#1d3a26;color:#8fe0a4;}
[data-app-theme="dark"] .file-row .fstatus.err{background:#3a231e;color:#f2a493;}
.detail-cover{width:150px;margin:0 auto 18px;border-radius:16px;overflow:hidden;box-shadow:var(--shadow-md);aspect-ratio:.68/1;}
.detail-title{text-align:center;font-size:22px;margin-bottom:2px;}
.detail-author{text-align:center;color:var(--muted);margin-bottom:18px;}
.detail-meta{display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--muted);margin-bottom:20px;flex-wrap:wrap;}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.settings-group{margin-bottom:22px;}
.settings-group h4{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;}
.option-row{display:flex;gap:8px;flex-wrap:wrap;}
.opt-btn{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-weight:700;font-size:13px;}
.opt-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.opt-btn.small{padding:8px 12px;font-size:12px;}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);}
.shelf-pick-row{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line);}
.checkbox{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;}
.checkbox.on{background:var(--primary);border-color:var(--primary);color:#fff;font-size:12px;}
.reader-overlay{position:fixed;inset:0;background:var(--reader-bg,var(--bg));z-index:80;display:flex;flex-direction:column;}
.reader-top{display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:var(--reader-surface,var(--surface));border-bottom:1px solid var(--line);}
.reader-title{flex:1;font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.reader-body{flex:1;overflow:auto;background:var(--reader-bg,var(--bg));position:relative;}
.reader-text{max-width:680px;margin:0 auto;padding:38px max(20px,7vw) 80px;font-family:var(--reader-font,var(--serif));font-size:var(--reader-size,19px);line-height:var(--reader-line,1.75);color:var(--reader-ink,var(--ink));}
.reader-text p{margin:0 0 1.15em;}
.reader-text img{display:none;}
.reader-paged{height:100%;display:flex;flex-direction:column;}
.reader-paged .page-content{flex:1;overflow:auto;padding:28px max(18px,5vw) 14px;font-family:var(--reader-font,var(--serif));font-size:var(--reader-size,19px);line-height:var(--reader-line,1.75);color:var(--reader-ink,var(--ink));max-width:720px;margin:0 auto;width:100%;box-sizing:border-box;}
.reader-paged .page-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));gap:10px;background:var(--reader-surface,var(--surface));border-top:1px solid var(--line);flex:none;}
.reader-bottom{display:flex;align-items:center;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--reader-surface,var(--surface));border-top:1px solid var(--line);font-size:12px;color:var(--muted);}
.reader-progress{flex:1;height:5px;border-radius:5px;background:var(--surface3);overflow:hidden;}
.reader-progress i{display:block;height:100%;background:var(--accent);}
.comic-view{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#0c0f0d;}
.comic-view img{max-width:100%;max-height:100%;object-fit:contain;}
.comic-tap{position:absolute;top:0;bottom:0;width:38%;}
.comic-tap.left{left:0;}
.comic-tap.right{right:0;}
.comic-reader-layout{display:flex;flex-direction:column;width:100%;height:100%;min-height:0;background:#0c0f0d;}
.comic-reader-layout .comic-view{flex:1;min-height:0;height:auto;}
.comic-page-controls{display:flex;flex-direction:column;gap:7px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--reader-surface,var(--surface));border-top:1px solid var(--line);}
.comic-nav-main,.comic-page-jump{display:flex;align-items:center;justify-content:center;gap:8px;}
.comic-nav-main .btn{min-width:92px;}
.comic-nav-main .comic-page-label{flex:1;min-width:60px;text-align:center;color:var(--muted);font-size:12px;font-weight:700;}
.comic-page-jump input{width:104px;min-width:70px;height:36px;padding:6px 9px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);font:inherit;font-size:13px;text-align:center;}
.comic-page-jump .btn{min-width:64px;min-height:36px;padding:7px 11px;}
@media(max-width:420px){.comic-page-controls{gap:6px;padding:7px 8px calc(7px + env(safe-area-inset-bottom,0px))}.comic-nav-main .btn{min-width:82px;padding:8px 7px;font-size:11px}.comic-page-jump input{width:92px}.comic-page-jump .btn{font-size:11px;padding:7px 9px}}
.reader-panel{position:absolute;top:58px;right:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow-lg);width:260px;z-index:5;max-height:calc(100vh - 80px);overflow:auto;}
.reader-panel h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:12px 0 8px;}
.reader-panel h4:first-child{margin-top:0;}
.reader-theme-row{display:flex;gap:7px;flex-wrap:wrap;}
.theme-dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);flex:none;}
.theme-dot.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
.fsize-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border-radius:12px;padding:6px 10px;}
.fsize-row button{width:30px;height:30px;border-radius:9px;background:var(--surface);font-weight:800;font-size:16px;}
iframe.pdf-frame{width:100%;height:100%;border:0;background:#525659;}
.toast-wrap{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92%,420px);}
.toast{background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);text-align:center;animation:toastin .18s ease;}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.storage-bar{height:8px;border-radius:8px;background:var(--surface3);overflow:hidden;margin:10px 0;}
.storage-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary-light),var(--accent));}
.profile-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);padding:22px;box-shadow:var(--shadow-md);margin-bottom:20px;}
.profile-header{display:flex;align-items:center;gap:16px;margin-bottom:14px;}
.profile-avatar{width:64px;height:64px;border-radius:20px;background:linear-gradient(150deg,var(--primary-light),var(--primary));color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800;flex:none;}
.profile-name{font-family:var(--serif);font-size:22px;font-weight:700;}
.profile-bio{font-size:14px;color:var(--muted);line-height:1.5;margin:8px 0 12px;}
.profile-genres{display:flex;flex-wrap:wrap;gap:6px;}
.tip-card{background:var(--surface2);border-radius:var(--radius-lg);padding:16px;margin-top:12px;border:1px solid var(--line);}
.tip-card b{display:block;margin-bottom:4px;}
.lock-screen{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.lock-screen .lock-icon{font-size:48px;margin-bottom:12px;}
.lock-screen h2{font-family:var(--serif);margin-bottom:8px;}
.pin-dots{display:flex;gap:12px;margin:20px 0;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:transparent;transition:background .15s;}
.pin-dot.filled{background:var(--primary);border-color:var(--primary);}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(280px,80vw);}
.pin-key{height:56px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:22px;font-weight:700;box-shadow:var(--shadow-sm);}
.pin-key:active{transform:scale(.94);}
.pin-key.action{font-size:14px;font-weight:800;}
.form-field{margin-bottom:14px;}
.form-field label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;}
.form-field input,.form-field textarea,.form-field select{width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--line);background:var(--surface2);outline:0;}
.form-field textarea{min-height:80px;resize:vertical;}
.time-stat{font-size:13px;color:var(--muted);margin-top:4px;}
.reading-now-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;}
@media (max-width:820px){
  .hero{grid-template-columns:1fr;}
  .stats-row{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:520px){
  .app{padding:12px 14px 100px;}
  .books-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:13px 10px;}
  .action-grid{grid-template-columns:1fr;}
  .hero-main{padding:24px;}
  .reader-panel{right:8px;width:220px;}
}

/* ---------- Refinamento visual ---------- */
:root{
  --bg:#f5f7f4; --surface:#ffffff; --surface2:#edf3ee; --surface3:#dfe9e1;
  --ink:#14231c; --muted:#687a70; --line:#dbe5dd;
  --primary:#1b4737; --primary-light:#34785b; --primary-dark:#0d2b20;
  --accent:#e17d43; --accent-dark:#bd5d2b; --accent-soft:#fce4d5;
  --radius-xl:24px; --radius-lg:18px; --radius-md:13px;
  --shadow-sm:0 2px 8px rgba(21,49,36,.06);
  --shadow-md:0 12px 28px rgba(21,49,36,.11);
  --shadow-lg:0 24px 55px rgba(21,49,36,.18);
}
[data-app-theme="dark"]{
  --bg:#101714; --surface:#18221d; --surface2:#202d26; --surface3:#2b3b32;
  --ink:#f0f5f1; --muted:#9caf9f; --line:#2d3e34;
}
body{min-height:100vh;background:radial-gradient(circle at 85% -10%,rgba(52,120,91,.08),transparent 30%),var(--bg);}
.app{max-width:1120px;padding-top:10px;}
.top{padding:10px 2px 15px;border-bottom:1px solid color-mix(in srgb,var(--line) 75%,transparent);}
.brand{font-size:19px;letter-spacing:-.03em;}
.brand em{font-family:var(--serif);font-style:italic;font-weight:500;color:var(--accent-dark);}
.brand-mark{width:40px;height:40px;border-radius:14px;background:linear-gradient(145deg,#ef9a5f,var(--accent-dark));}
.icon-btn{border-radius:12px;}
.hero{gap:18px;margin-top:26px;}
.hero-main{min-height:230px;padding:34px;background:radial-gradient(110% 150% at 0% 0%,#408567,var(--primary) 53%,var(--primary-dark));}
.hero-main::before{content:"";position:absolute;inset:0;background-image:linear-gradient(120deg,rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(30deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:32px 32px;opacity:.35;}
.hero-main>*{position:relative;z-index:1;}
.hero-side{padding:26px;border-color:color-mix(in srgb,var(--accent) 25%,var(--line));}
.hero-side strong{font-size:48px;color:var(--primary);}
[data-app-theme="dark"] .hero-side strong{color:var(--accent);}
.stat-card,.shelf-card,.profile-card{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;}
.stat-card:hover,.shelf-card:hover,.profile-card:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));}
.stat-card{padding:17px 16px;}
.stat-card strong{color:var(--primary);}
[data-app-theme="dark"] .stat-card strong{color:var(--accent);}
.books-grid{grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:24px 18px;}
.book .cover-wrap{border-radius:14px;}
.book-title{font-size:13px;}
.toolbar{align-items:center;margin-top:22px;}
.search-box input{height:46px;border-radius:13px;background:color-mix(in srgb,var(--surface) 94%,var(--surface2));}
.search-box input:focus,.form-field input:focus,.form-field textarea:focus,.form-field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.chip{padding:8px 13px;}
.empty{background:color-mix(in srgb,var(--surface) 65%,transparent);}
.bottom{width:min(94%,700px);border-radius:19px 19px 0 0;}
.nav-btn.active{color:var(--primary);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--line) 70%,transparent);}
[data-app-theme="dark"] .nav-btn.active{color:var(--accent);}
.btn:focus-visible,.icon-btn:focus-visible,.chip:focus-visible,.nav-btn:focus-visible,.book:focus-visible,.shelf-card:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 65%,transparent);outline-offset:2px;}
.modal-bg{padding:14px;}
.modal{border:1px solid var(--line);}
.reader-top{box-shadow:0 4px 18px rgba(0,0,0,.06);}
@media (max-width:520px){
  .app{padding:10px 14px 100px;}
  .top{padding-bottom:12px;}
  .hero-main{min-height:220px;padding:25px;}
  .books-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 15px;}
  .book-info{padding-top:8px;}
  .book-title{font-size:13px;}
  .bottom{width:100%;}
}
/* ===== Splash / Opening ===== */
.splash{
  position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(120% 100% at 50% 20%,#2a5a45 0%,#1b4737 45%,#0d2b20 100%);
  color:#fff;overflow:hidden;transition:opacity .7s ease,transform .7s ease;
}
.splash.exit{opacity:0;transform:scale(1.04);pointer-events:none;}
.splash-bg-pages{
  position:absolute;inset:0;opacity:.12;pointer-events:none;
  background-image:
    radial-gradient(circle at 20% 30%,rgba(255,255,255,.25),transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(255,255,255,.15),transparent 35%);
}
.splash-mark{
  width:72px;height:72px;border-radius:22px;margin-bottom:28px;
  background:linear-gradient(145deg,#ef9a5f,#bd5d2b);
  display:grid;place-items:center;font-size:32px;
  box-shadow:0 16px 40px rgba(0,0,0,.35);
  animation:splashPop .9s cubic-bezier(.2,.9,.3,1) both;
}
.splash-phrase{
  font-family:var(--serif);font-size:clamp(22px,5.5vw,34px);font-weight:600;
  text-align:center;max-width:16ch;line-height:1.25;letter-spacing:-.02em;
  padding:0 24px;opacity:0;transform:translateY(18px);
  animation:splashPhrase 1.1s cubic-bezier(.2,.8,.2,1) .35s both;
}
.splash-sub{
  margin-top:18px;font-size:13px;opacity:0;letter-spacing:.12em;text-transform:uppercase;
  font-weight:700;color:rgba(255,255,255,.65);
  animation:splashPhrase .8s ease 1.2s both;
}
.splash-actions{
  position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));
  left:0;right:0;display:flex;justify-content:center;gap:12px;padding:0 20px;
}
.splash-btn{
  padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;
  backdrop-filter:blur(8px);transition:background .15s,transform .15s;
}
.splash-btn:hover{background:rgba(255,255,255,.2);transform:translateY(-1px);}
.splash-btn:active{transform:scale(.96);}
@keyframes splashPop{from{opacity:0;transform:scale(.7) rotate(-8deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes splashPhrase{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){
  .splash-mark,.splash-phrase,.splash-sub{animation:none;opacity:1;transform:none;}
  .splash.exit{transition:opacity .25s ease;}
}

/* ===== Import progress ===== */
.import-progress-wrap{margin:16px 0 8px;}
.import-progress-label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:6px;color:var(--muted);}
.import-progress-bar{height:10px;border-radius:10px;background:var(--surface3);overflow:hidden;}
.import-progress-bar i{display:block;height:100%;width:0%;border-radius:10px;background:linear-gradient(90deg,var(--primary-light),var(--accent));transition:width .25s ease;}
.import-progress-pct{font-variant-numeric:tabular-nums;}

/* ===== Page flip animation ===== */
.page-flip-wrap{position:relative;height:100%;perspective:1400px;overflow:hidden;}
.page-flip-inner{
  height:100%;transform-style:preserve-3d;position:relative;
}
.page-content.flip-out-next{
  animation:flipOutNext .42s cubic-bezier(.25,.8,.25,1) both;
}
.page-content.flip-out-prev{
  animation:flipOutPrev .42s cubic-bezier(.25,.8,.25,1) both;
}
.page-content.flip-in-next{
  animation:flipInNext .42s cubic-bezier(.25,.8,.25,1) both;
}
.page-content.flip-in-prev{
  animation:flipInPrev .42s cubic-bezier(.25,.8,.25,1) both;
}
@keyframes flipOutNext{
  0%{transform:rotateY(0);opacity:1;filter:brightness(1)}
  100%{transform:rotateY(-75deg) translateX(-8%);opacity:0;filter:brightness(.7)}
}
@keyframes flipInNext{
  0%{transform:rotateY(75deg) translateX(8%);opacity:0;filter:brightness(.7)}
  100%{transform:rotateY(0);opacity:1;filter:brightness(1)}
}
@keyframes flipOutPrev{
  0%{transform:rotateY(0);opacity:1;filter:brightness(1)}
  100%{transform:rotateY(75deg) translateX(8%);opacity:0;filter:brightness(.7)}
}
@keyframes flipInPrev{
  0%{transform:rotateY(-75deg) translateX(-8%);opacity:0;filter:brightness(.7)}
  100%{transform:rotateY(0);opacity:1;filter:brightness(1)}
}
@media (prefers-reduced-motion: reduce){
  .page-content.flip-out-next,.page-content.flip-out-prev,
  .page-content.flip-in-next,.page-content.flip-in-prev{animation:none;}
}

/* Voice picker */
.voice-list{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:14px;margin-top:8px;}
.voice-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;
  transition:background .12s;
}
.voice-row:last-child{border-bottom:0;}
.voice-row:hover{background:var(--surface2);}
.voice-row.active{background:color-mix(in srgb,var(--accent-soft) 70%,var(--surface));}
.voice-row .v-name{font-weight:700;}
.voice-row .v-meta{font-size:11px;color:var(--muted);}
.voice-badge{
  font-size:10px;font-weight:800;padding:3px 7px;border-radius:7px;
  background:var(--surface3);letter-spacing:.03em;
}
.voice-badge.fem{background:#f3dde8;color:#8a3a5c;}
.voice-badge.masc{background:#dce8f5;color:#2f4f7a;}
[data-app-theme="dark"] .voice-badge.fem{background:#3a2430;color:#f0a8c0;}
[data-app-theme="dark"] .voice-badge.masc{background:#243040;color:#a8c4f0;}


/* ===== Temas do app: claro, escuro, amoled, sépia ===== */
[data-app-theme="sepia"]{
  --bg:#f3e6c9; --surface:#faf3e3; --surface2:#efe2c4; --surface3:#e4d4ad;
  --ink:#3a2e1d; --muted:#8a7355; --line:#d9c9a4;
  --primary:#6b4f2a; --primary-light:#8a6a3c; --primary-dark:#3d2c16;
  --accent:#c4783a; --accent-dark:#a05e28; --accent-soft:#f5e0c8;
  --shadow-sm:0 2px 8px rgba(60,40,15,.08);
  --shadow-md:0 12px 28px rgba(60,40,15,.12);
  --shadow-lg:0 24px 55px rgba(60,40,15,.18);
}
[data-app-theme="amoled"]{
  --bg:#000000; --surface:#0a0a0a; --surface2:#141414; --surface3:#1c1c1c;
  --ink:#f2f2f2; --muted:#8a8a8a; --line:#222222;
  --primary:#2d6b52; --primary-light:#3d8a68; --primary-dark:#1a4030;
  --accent:#e17d43; --accent-dark:#bd5d2b; --accent-soft:#3a2818;
  --shadow-sm:0 2px 10px rgba(0,0,0,.5); --shadow-md:0 12px 30px rgba(0,0,0,.6); --shadow-lg:0 26px 54px rgba(0,0,0,.75);
}
[data-app-theme="amoled"] .nav-btn.active{color:var(--accent);}
[data-app-theme="sepia"] .nav-btn.active{color:var(--primary);}
[data-app-theme="amoled"] .stat-card strong,
[data-app-theme="amoled"] .hero-side strong{color:var(--accent);}
[data-app-theme="sepia"] .stat-card strong,
[data-app-theme="sepia"] .hero-side strong{color:var(--primary);}

/* ===== Botões modernos ===== */
.btn{
  border-radius:16px;padding:13px 20px;font-weight:700;letter-spacing:-.01em;
  background:var(--surface);border:1px solid var(--line);
  box-shadow:0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
  transition:transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s, background .18s, border-color .18s, filter .15s;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  position:relative;overflow:hidden;
}
.btn::after{
  content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 50%);
  opacity:.5;pointer-events:none;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.10);}
.btn:active{transform:scale(.97);}
.btn.primary{
  background:linear-gradient(145deg,var(--accent),var(--accent-dark));
  color:#fff;border-color:transparent;
  box-shadow:0 4px 14px color-mix(in srgb, var(--accent) 45%, transparent);
}
.btn.primary:hover{filter:brightness(1.06);box-shadow:0 8px 22px color-mix(in srgb, var(--accent) 50%, transparent);}
.btn.dark{
  background:linear-gradient(145deg,var(--primary-light),var(--primary));
  color:#fff;border-color:transparent;
  box-shadow:0 4px 14px color-mix(in srgb, var(--primary) 40%, transparent);
}
.btn.danger{
  background:linear-gradient(145deg,#d45a45,#c1503a);color:#fff;border-color:transparent;
  box-shadow:0 4px 12px rgba(193,80,58,.35);
}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;}
.btn.ghost:hover{background:var(--surface2);}
.btn.small{padding:9px 14px;font-size:13px;border-radius:12px;}
.btn.block{width:100%;}
.btn .btn-ic, .btn svg{flex:none;}
.icon-btn{
  width:44px;height:44px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);
  box-shadow:0 1px 3px rgba(0,0,0,.05);
  transition:transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s, background .18s, border-color .18s;
}
.icon-btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 8px 18px rgba(0,0,0,.1);border-color:color-mix(in srgb,var(--accent) 35%,var(--line));}
.icon-btn.accent{
  background:linear-gradient(145deg,var(--accent),var(--accent-dark));
  color:#fff;border:none;
  box-shadow:0 4px 14px color-mix(in srgb, var(--accent) 40%, transparent);
}
.icon-btn.accent:hover{filter:brightness(1.08);}
.opt-btn{
  padding:11px 15px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--surface2);font-weight:700;font-size:13px;
  transition:transform .15s, background .15s, border-color .15s, color .15s, box-shadow .15s;
}
.opt-btn:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 40%,var(--line));}
.opt-btn.active{
  background:linear-gradient(145deg,var(--primary-light),var(--primary));
  color:#fff;border-color:transparent;
  box-shadow:0 4px 12px color-mix(in srgb, var(--primary) 35%, transparent);
}
.chip{
  padding:9px 15px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);
  font-size:13px;font-weight:700;color:var(--muted);
  transition:transform .15s, background .15s, color .15s, border-color .15s, box-shadow .15s;
}
.chip:hover{transform:translateY(-1px);}
.chip.active{
  background:linear-gradient(145deg,var(--primary-light),var(--primary));
  border-color:transparent;color:#fff;
  box-shadow:0 3px 10px color-mix(in srgb, var(--primary) 30%, transparent);
}
.chip.selectable.on{
  background:linear-gradient(145deg,var(--accent),var(--accent-dark));
  border-color:transparent;color:#fff;
}
.nav-btn{
  border-radius:16px;padding:10px 6px;
  transition:background .2s, color .2s, transform .15s, box-shadow .2s;
}
.nav-btn.active{
  background:var(--surface2);color:var(--primary);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--line) 80%,transparent);
}
.action-grid .btn{min-height:48px;font-size:14px;}
.theme-preview{
  width:36px;height:36px;border-radius:12px;border:2px solid var(--line);
  position:relative;overflow:hidden;flex:none;
  transition:transform .15s, box-shadow .15s, border-color .15s;
}
.theme-preview.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);transform:scale(1.06);}
.theme-preview span{position:absolute;inset:0;}

/* ===== Animações de página ===== */
.page-anim-curl .page-content.flip-out-next{
  animation:curlOutNext .55s cubic-bezier(.25,.8,.25,1) both;
  transform-origin:left center;
}
.page-anim-curl .page-content.flip-in-next{
  animation:curlInNext .55s cubic-bezier(.25,.8,.25,1) both;
  transform-origin:left center;
}
.page-anim-curl .page-content.flip-out-prev{
  animation:curlOutPrev .55s cubic-bezier(.25,.8,.25,1) both;
  transform-origin:right center;
}
.page-anim-curl .page-content.flip-in-prev{
  animation:curlInPrev .55s cubic-bezier(.25,.8,.25,1) both;
  transform-origin:right center;
}
@keyframes curlOutNext{
  0%{transform:rotateY(0) scaleX(1);opacity:1;filter:brightness(1);box-shadow:none}
  40%{filter:brightness(.92);box-shadow:-8px 0 24px rgba(0,0,0,.15)}
  100%{transform:rotateY(-95deg) scaleX(.92);opacity:0;filter:brightness(.65)}
}
@keyframes curlInNext{
  0%{transform:rotateY(95deg) scaleX(.92);opacity:0;filter:brightness(.65)}
  60%{filter:brightness(.95)}
  100%{transform:rotateY(0) scaleX(1);opacity:1;filter:brightness(1)}
}
@keyframes curlOutPrev{
  0%{transform:rotateY(0) scaleX(1);opacity:1}
  100%{transform:rotateY(95deg) scaleX(.92);opacity:0;filter:brightness(.65)}
}
@keyframes curlInPrev{
  0%{transform:rotateY(-95deg) scaleX(.92);opacity:0;filter:brightness(.65)}
  100%{transform:rotateY(0) scaleX(1);opacity:1;filter:brightness(1)}
}
.page-anim-slide .page-content.flip-out-next{animation:slideOutLeft .35s ease both;}
.page-anim-slide .page-content.flip-in-next{animation:slideInRight .35s ease both;}
.page-anim-slide .page-content.flip-out-prev{animation:slideOutRight .35s ease both;}
.page-anim-slide .page-content.flip-in-prev{animation:slideInLeft .35s ease both;}
@keyframes slideOutLeft{to{transform:translateX(-28%);opacity:0}}
@keyframes slideInRight{from{transform:translateX(28%);opacity:0}to{transform:none;opacity:1}}
@keyframes slideOutRight{to{transform:translateX(28%);opacity:0}}
@keyframes slideInLeft{from{transform:translateX(-28%);opacity:0}to{transform:none;opacity:1}}
.page-anim-fade .page-content.flip-out-next,
.page-anim-fade .page-content.flip-out-prev{animation:fadeOutPage .28s ease both;}
.page-anim-fade .page-content.flip-in-next,
.page-anim-fade .page-content.flip-in-prev{animation:fadeInPage .28s ease both;}
@keyframes fadeOutPage{to{opacity:0;transform:scale(.98)}}
@keyframes fadeInPage{from{opacity:0;transform:scale(1.02)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  .page-content.flip-out-next,.page-content.flip-out-prev,
  .page-content.flip-in-next,.page-content.flip-in-prev{animation:none !important;}
}

/* Audio a11y */
.audio-a11y-hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.4;}



/* ===== Navegação e ações: refinamento responsivo ===== */
:root{--nav-glow:color-mix(in srgb,var(--accent) 16%,transparent)}
.bottom{
  bottom:18px; border:1px solid color-mix(in srgb,var(--line) 82%,transparent);
  border-radius:24px; padding:8px; gap:6px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  box-shadow:0 16px 42px rgba(16,35,25,.16), inset 0 1px 0 rgba(255,255,255,.56);
  backdrop-filter:blur(22px) saturate(1.35); -webkit-backdrop-filter:blur(22px) saturate(1.35);
}
.nav-btn{
  min-height:60px; flex:1; position:relative; overflow:hidden;
  justify-content:center; gap:5px; padding:7px 10px;
  color:var(--muted); font-size:11px; letter-spacing:.01em;
  border:1px solid transparent; border-radius:17px;
}
.nav-btn .ic{
  width:34px;height:30px;border-radius:11px;
  transition:background .2s ease,transform .2s cubic-bezier(.2,.8,.2,1),color .2s ease;
}
.nav-btn .ic svg{width:21px;height:21px;transition:transform .2s ease,stroke-width .2s ease;}
.nav-btn:hover{background:color-mix(in srgb,var(--surface2) 70%,transparent);color:var(--primary);transform:translateY(-2px);}
.nav-btn:hover .ic svg{transform:translateY(-1px);}
.nav-btn.active{
  background:linear-gradient(145deg,color-mix(in srgb,var(--surface) 96%,var(--accent-soft)),var(--surface2));
  color:var(--primary); border-color:color-mix(in srgb,var(--accent) 18%,var(--line));
  box-shadow:0 4px 14px var(--nav-glow),inset 0 1px 0 rgba(255,255,255,.65);
}
.nav-btn.active .ic{background:linear-gradient(145deg,var(--accent),var(--accent-dark));color:#fff;box-shadow:0 4px 10px color-mix(in srgb,var(--accent) 32%,transparent);}
.nav-btn.active .ic svg{stroke-width:2.1;transform:scale(1.04);}
.nav-btn.active::after{content:"";position:absolute;bottom:4px;width:14px;height:3px;border-radius:3px;background:var(--accent);opacity:.85;}
[data-app-theme="dark"] .nav-btn.active,[data-app-theme="amoled"] .nav-btn.active{color:var(--ink);}
[data-app-theme="dark"] .bottom,[data-app-theme="amoled"] .bottom{box-shadow:0 18px 48px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.04);}
.top-actions{gap:10px;}
.icon-btn{width:46px;height:46px;border-radius:15px;}
.icon-btn:focus-visible,.btn:focus-visible,.nav-btn:focus-visible,.chip:focus-visible,.opt-btn:focus-visible,.close-x:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:3px;}
.btn{min-height:44px;}
button{touch-action:manipulation;}
@media(min-width:521px){
  .app{padding-bottom:116px;}
  .bottom{border-bottom:1px solid color-mix(in srgb,var(--line) 82%,transparent);}
}
@media(max-width:520px){
  .bottom{bottom:0;width:100%;border-radius:22px 22px 0 0;border-bottom:0;padding:7px 7px calc(7px + env(safe-area-inset-bottom,0px));gap:3px;}
  .nav-btn{min-height:58px;padding:6px 3px;font-size:10.5px;border-radius:15px;}
  .nav-btn .ic{width:32px;height:29px;}
  .top-actions{gap:8px;}
  .icon-btn{width:44px;height:44px;}
}
@media(prefers-reduced-motion:reduce){
  .nav-btn,.nav-btn .ic,.nav-btn .ic svg,.btn,.icon-btn{transition:none!important;}
}



/* Controles de áudio e seletor de vozes */
.audio-close-btn{width:38px;height:38px;border-radius:13px;background:color-mix(in srgb,var(--danger) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--danger) 24%,var(--line));color:var(--danger);transition:transform .18s,background .18s,box-shadow .18s;}
.audio-close-btn:hover{background:var(--danger);color:#fff;transform:rotate(90deg) scale(1.04);box-shadow:0 5px 14px color-mix(in srgb,var(--danger) 30%,transparent);}
.audio-btn,.mini-btn,.audio-speed{box-shadow:0 2px 8px rgba(15,30,22,.07);}
.audio-btn:hover,.mini-btn:hover,.audio-speed:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 7px 16px rgba(15,30,22,.12);}
.mini-btn#miniStop{color:var(--danger);}
.voice-list{overflow:hidden;}
.voice-row{width:100%;text-align:left;color:var(--ink);background:var(--surface);border:0;border-bottom:1px solid var(--line);font:inherit;}
.voice-row:last-child{border-bottom:0;}
.voice-row:hover{background:var(--surface2);}
.voice-row.active{background:color-mix(in srgb,var(--accent-soft) 62%,var(--surface));box-shadow:inset 3px 0 0 var(--accent);}

/* ===== Redesign visual geral: biblioteca contemporânea ===== */
:root{

[data-app-theme="sepia"]{--bg:#f3ead7;--surface:#fcf6e9;--surface2:#f1e6cd;--surface3:#e7d8b7;--ink:#372e21;--muted:#837256;--line:#ddcfb1;}

body{background:radial-gradient(ellipse at 84% 0%,color-mix(in srgb,var(--primary-light) 10%,transparent),transparent 32%),radial-gradient(ellipse at 0% 38%,color-mix(in srgb,var(--accent) 5%,transparent),transparent 30%),var(--bg);}

.splash-actions{position:absolute;z-index:4;left:0;right:0;bottom:calc(13px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:9px;padding:0 12px;}
.splash-btn{min-height:39px;padding:8px 14px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.02em;background:rgba(255,255,255,.06);border:1px solid rgba(222,208,171,.27);color:#e7edf7;backdrop-filter:blur(10px);transition:background .18s,border-color .18s,transform .18s;touch-action:manipulation;}
.splash-btn:hover{background:rgba(255,255,255,.12);border-color:rgba(230,207,147,.55);}
.splash-btn:active{transform:scale(.97);}
.splash-btn:focus-visible{outline:2px solid #f3d98f;outline-offset:3px;}
#appRoot{transform-origin:center;}
.app.library-reveal{animation:libraryReveal .7s cubic-bezier(.2,.75,.25,1) both;}
@keyframes premiumAura{to{opacity:.8;transform:scale(1.08)}}
@keyframes premiumBeam{0%{opacity:0;transform:translateX(-50%) scaleY(.2)}45%{opacity:.8}100%{opacity:.42;transform:translateX(-50%) scaleY(1)}}
@keyframes premiumParticle{0%{opacity:0;transform:translate3d(0,15px,0) scale(.65)}25%{opacity:.8}78%{opacity:.55}100%{opacity:0;transform:translate3d(var(--dx),-70px,0) scale(1.15)}}
@keyframes shelfGlow{to{opacity:1}}
@keyframes shelfSet{to{opacity:1;transform:scaleX(1)}}
@keyframes bookDock{0%{opacity:0;transform:translate3d(var(--from-x),var(--from-y),0) rotateY(var(--from-yaw)) rotateZ(var(--from-roll)) scale(.92)}70%{opacity:1;transform:translate3d(0,-7px,0) rotateY(0) rotateZ(0) scale(1.02)}100%{opacity:1;transform:translate3d(0,0,0) rotateY(0) rotateZ(0) scale(1)}}
@keyframes brandReveal{to{opacity:1;transform:translateY(0)}}
@keyframes libraryReveal{from{opacity:.88;transform:translateY(8px) scale(.995)}to{opacity:1;transform:none}}
/* Abertura da capa ao entrar no leitor */
.reader-overlay.book-open-enter:before{content:"";position:fixed;z-index:15;left:50%;top:50%;width:min(62vw,270px);aspect-ratio:.68/1;transform:translate(-50%,-50%) scale(.72) rotateY(-16deg);transform-origin:center;background:var(--reader-open-cover,linear-gradient(145deg,#43628e,#172b49));background-size:cover;background-position:center;border-radius:15px;box-shadow:0 22px 56px rgba(0,0,0,.38);animation:coverBecomesPage .72s cubic-bezier(.2,.72,.2,1) both;pointer-events:none;}
@keyframes coverBecomesPage{0%{opacity:1;transform:translate(-50%,-50%) scale(.72) rotateY(-16deg);border-radius:15px}56%{opacity:1;transform:translate(-50%,-50%) scale(1.35,1.18) rotateY(0);border-radius:8px}100%{opacity:0;transform:translate(-50%,-50%) scale(5.4,4.2);border-radius:0}}
/* Ações de navegação rápida no modo paginado */
.reader-paged .page-nav{display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:7px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));min-height:0;}
.page-nav-main{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.reader-paged .page-nav-main .btn{min-width:96px;}
.page-nav-main .page-label{flex:1;min-width:58px;text-align:center;font-size:12px;font-weight:700;}
.page-jump-tools{display:flex;align-items:center;justify-content:center;gap:8px;}
.page-jump-tools input{width:104px;min-width:70px;height:36px;padding:6px 9px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);font:inherit;font-size:13px;text-align:center;}
.page-jump-tools input:focus{outline:2px solid var(--primary-light);outline-offset:1px;}
.page-jump-tools .btn{min-width:64px!important;min-height:36px;padding:7px 11px;}
.page-home-btn{min-width:76px!important;}
.page-jump-enter{animation:pageJumpEnter .22s ease-out;}
@keyframes pageJumpEnter{from{opacity:.55;transform:translateY(3px)}to{opacity:1;transform:none}}
/* Celebração de conclusão: partículas pequenas, sem explosão */
.book-finish-particles{position:fixed;left:50%;top:42%;z-index:130;pointer-events:none;width:1px;height:1px;}
.book-finish-particles i{position:absolute;width:5px;height:5px;border-radius:50%;background:#e5c36c;box-shadow:0 0 9px rgba(229,195,108,.7);animation:finishSpark .95s ease-out forwards;}
@keyframes finishSpark{0%{opacity:0;transform:translate(0,0) scale(.4)}18%{opacity:.9}100%{opacity:0;transform:translate(var(--spark-x),var(--spark-y)) scale(.15)}}
@media(prefers-reduced-motion:reduce){.splash:before,.splash:after,.splash-particle,.splash-book,.splash-shelf-board,.splash-shelf-glow,.splash-brand,.splash-phrase,.app.library-reveal,.reader-overlay.book-open-enter:before,.page-jump-enter,.book-finish-particles i{animation:none!important;transition-duration:.12s!important}.splash-brand,.splash-phrase,.splash-book{opacity:1;transform:none}.reader-overlay.book-open-enter:before{display:none}}
@media(max-width:420px){.splash-stage{min-height:390px;height:74vh}.splash-shelf{width:94vw;gap:5px}.splash-book{flex-basis:clamp(43px,13.6vw,58px);width:clamp(43px,13.6vw,58px);height:clamp(125px,29vh,160px)}.splash-book-fallback{padding:9px 5px}.splash-book-fallback small{font-size:6px}.splash-brand{margin-top:21px}.reader-paged .page-nav{gap:6px;padding:7px 8px calc(7px + env(safe-area-inset-bottom,0px))}.reader-paged .page-nav-main .btn{min-width:82px;padding:8px 7px;font-size:11px}.page-jump-tools input{width:92px}.page-jump-tools .btn{padding:7px 9px;font-size:11px}}


/* A palavra narrada acompanha a voz com destaque e um salto suave */
.audio-word{display:inline-block;border-radius:.24em;transition:color .16s,background-color .16s,box-shadow .16s,transform .16s;transform-origin:50% 80%;}
.audio-word-current{position:relative;z-index:1;color:#185fb9!important;background:rgba(93,157,245,.16);box-shadow:0 0 0 2px rgba(93,157,245,.11),0 0 12px rgba(93,157,245,.2);transform:translateY(-1.5px) scale(1.035);}
.audio-word-pop{animation:audioWordPop .34s cubic-bezier(.2,.85,.25,1);}
@keyframes audioWordPop{0%{transform:translateY(0) scale(1)}42%{transform:translateY(-4px) scale(1.075)}100%{transform:translateY(-1.5px) scale(1.035)}}
[data-app-theme="dark"] .audio-word-current,[data-app-theme="amoled"] .audio-word-current{color:#b6d6ff!important;background:rgba(93,157,245,.2);box-shadow:0 0 0 2px rgba(93,157,245,.13),0 0 14px rgba(93,157,245,.18);}
@media(prefers-reduced-motion:reduce){.audio-word,.audio-word-pop{animation:none!important;transition:none!important;transform:none!important}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
  if(window.pdfjsLib){
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }

  /* ---------- Helpers ---------- */
  const $ = (s,ctx)=> (ctx||document).querySelector(s);
  const $$ = (s,ctx)=> [...(ctx||document).querySelectorAll(s)];
  const uid = ()=> (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2));
  const escapeHtml = s => (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const sleep = ms => new Promise(r=>setTimeout(r,ms));
  function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
  function fmtBytes(n){ if(!n) return '0 KB'; const u=['B','KB','MB','GB']; let i=0; while(n>=1024&&i<u.length-1){n/=1024;i++;} return n.toFixed(i?1:0)+' '+u[i]; }
  function fmtDate(ts){ return new Date(ts).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'}); }
  function fmtDuration(ms){
    if(!ms || ms<0) return '0 min';
    const totalMin = Math.round(ms/60000);
    if(totalMin < 60) return totalMin + ' min';
    const h = Math.floor(totalMin/60);
    const m = totalMin % 60;
    return h + ' h' + (m ? ' ' + m + ' min' : '');
  }
  function todayKey(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function toast(msg){
    const root = $('#toastRoot');
    const el = document.createElement('div');
    el.className='toast'; el.textContent=msg;
    root.appendChild(el);
    setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),260); }, 2600);
  }
  async function hashPin(pin){
    const data = new TextEncoder().encode('estante-pro-salt-v1:'+pin);
    const buf = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  /* ---------- IndexedDB ---------- */
  const DB_NAME='estanteProDB', DB_VERSION=2;
  let db;
  const pendingBookSaves=new Map();
  function cancelPendingBookSave(id){const timer=pendingBookSaves.get(id);if(timer){clearTimeout(timer);pendingBookSaves.delete(id);}}
  function openDB(){
    return new Promise((res,rej)=>{
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = e=>{
        const d = e.target.result;
        if(!d.objectStoreNames.contains('books')) d.createObjectStore('books',{keyPath:'id'});
        if(!d.objectStoreNames.contains('shelves')) d.createObjectStore('shelves',{keyPath:'id'});
      };
      req.onsuccess = e=>{ db=e.target.result; res(db); };
      req.onerror = e=> rej(e.target.error);
    });
  }
  function idbGetAll(store){
    return new Promise((res,rej)=>{
      const tx=db.transaction(store,'readonly'); const r=tx.objectStore(store).getAll();
      r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error);
    });
  }
  function idbPut(store,val){
    return new Promise((res,rej)=>{
      const tx=db.transaction(store,'readwrite'); tx.objectStore(store).put(val);
      tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
    });
  }
  function idbDelete(store,id){
    if(store==='books')cancelPendingBookSave(id);
    return new Promise((res,rej)=>{
      const tx=db.transaction(store,'readwrite'); tx.objectStore(store).delete(id);
      tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
    });
  }

  /* ---------- State ---------- */
  let books = [];
  let shelves = [];
  let view = 'home';
  let libFilter = 'all';
  let libSort = 'recent';
  let libQuery = '';
  let selectionMode = false;
  let selected = new Set();
  const readerZipCache = {};
  let readingSessionStart = null;
  let readingSessionBookId = null;
  let activeReaderBookId = null;
  let ttsUtterance = null;
  let ttsPlaying = false;
  let pagedState = { chapterIdx:0, pageIdx:0, pages:[] };
  let pagedKeyHandler = null;
  let pagedResizeHandler = null;
  let screenWakeLock = null;

  function safeJSON(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      if(raw==null || raw==='') return fallback;
      const v = JSON.parse(raw);
      return (v==null ? fallback : v);
    }catch(e){ return fallback; }
  }
  let settings = Object.assign({
    appTheme:'light', readerTheme:'light', readerFont:'serif', readerSize:19,
    readerMode:'scroll', pageAnim:'curl', pinHash:null, dailyGoalMin:30,
    voiceURI:null, soundMuted:false, introSeen:false, keepScreenOn:false
  }, safeJSON('estanteProSettings', {}));
  if(settings.voiceURI===undefined) settings.voiceURI=null;
  if(settings.soundMuted===undefined) settings.soundMuted=false;
  if(settings.introSeen===undefined) settings.introSeen=false;
  if(settings.keepScreenOn===undefined) settings.keepScreenOn=false;
  if(settings.pageAnim===undefined) settings.pageAnim='curl';
  if(!['light','dark','amoled','sepia'].includes(settings.appTheme)) settings.appTheme='light';
  if(!['light','sepia','dark','amoled'].includes(settings.readerTheme)) settings.readerTheme='light';
  if(!['scroll','page'].includes(settings.readerMode)) settings.readerMode='scroll';
  if(!['flip','curl','slide','fade'].includes(settings.pageAnim)) settings.pageAnim='curl';
  let profile = Object.assign({
    name:'', bio:'', genres:[], avatarEmoji:'📚', goalPages:20
  }, safeJSON('estanteProProfile', {}));
  let dailyStats = safeJSON('estanteProDaily', {}) || {};

  function saveSettings(){ localStorage.setItem('estanteProSettings', JSON.stringify(settings)); }
  function updateScreenWakeControls(){
    const enabled=!!settings.keepScreenOn;
    ['readerWakeBtn','panelWakeBtn','keepScreenSetting'].forEach(id=>{
      const b=$('#'+id); if(!b)return;
      b.classList.toggle('active',enabled);
      b.setAttribute('aria-pressed',enabled?'true':'false');
      b.setAttribute('aria-label',enabled?'Desativar tela sempre ligada':'Manter a tela ligada durante a leitura');
      b.title=enabled?'Desativar tela sempre ligada':'Manter a tela ligada durante a leitura';
    });
    const label=$('#keepScreenLabel'); if(label) label.textContent=enabled?'Ativa':'Desativada';
    const readerLabel=$('#readerWakeLabel'); if(readerLabel) readerLabel.textContent=enabled?'Tela ligada':'Manter tela ligada';
  }
  async function requestScreenWakeLock(showError){
    if(!settings.keepScreenOn||!activeReaderBookId||document.visibilityState==='hidden') return false;
    if(screenWakeLock&&!screenWakeLock.released) return true;
    if(!navigator.wakeLock||typeof navigator.wakeLock.request!=='function'){
      settings.keepScreenOn=false; saveSettings(); updateScreenWakeControls();
      if(showError) toast('Este navegador não oferece suporte para manter a tela ligada.');
      return false;
    }
    try{
      const lock=await navigator.wakeLock.request('screen');
      if(!settings.keepScreenOn||!activeReaderBookId||document.visibilityState==='hidden'){
        try{await lock.release();}catch(e){}
        return false;
      }
      screenWakeLock=lock;
      lock.addEventListener('release',()=>{
        if(screenWakeLock===lock) screenWakeLock=null;
        updateScreenWakeControls();
      },{once:true});
      updateScreenWakeControls();
      return true;
    }catch(e){
      settings.keepScreenOn=false; saveSettings(); updateScreenWakeControls();
      if(showError) toast('Não foi possível manter a tela ligada neste momento.');
      return false;
    }
  }
  async function releaseScreenWakeLock(){
    const lock=screenWakeLock; screenWakeLock=null;
    if(lock&&!lock.released){try{await lock.release();}catch(e){}}
    updateScreenWakeControls();
  }
  async function toggleScreenWake(){
    settings.keepScreenOn=!settings.keepScreenOn;
    saveSettings(); updateScreenWakeControls();
    if(settings.keepScreenOn){
      if(activeReaderBookId){
        const ok=await requestScreenWakeLock(true);
        if(ok) toast('Tela ligada durante a leitura.');
      }else toast('A tela ficará ligada quando você abrir um livro para ler.');
    }else{
      await releaseScreenWakeLock();
      toast('Modo de tela sempre ligada desativado.');
    }
  }
  function saveProfile(){ localStorage.setItem('estanteProProfile', JSON.stringify(profile)); }
  function saveDaily(){ localStorage.setItem('estanteProDaily', JSON.stringify(dailyStats)); }

  document.body.dataset.appTheme = settings.appTheme;

  const FONT_MAP = {
    serif: 'var(--serif)',
    sans: 'var(--sans)',
    dyslexic: 'var(--dyslexic)',
    mono: 'var(--mono)',
    georgia: 'var(--georgia)',
    verdana: 'var(--verdana)',
    tahoma: 'var(--tahoma)'
  };
  const FONT_LABELS = {
    serif:'Serifada', sans:'Sem serifa', dyslexic:'Leitura fácil',
    mono:'Monoespaçada', georgia:'Georgia', verdana:'Verdana', tahoma:'Tahoma'
  };

  const READER_THEMES = {
    light:{bg:'#f6f2e9',surface:'#fffdf9',ink:'#20281f'},
    sepia:{bg:'#f1e6cd',surface:'#f7eeda',ink:'#3a2e1d'},
    dark:{bg:'#20241f',surface:'#282d26',ink:'#e9ece5'},
    amoled:{bg:'#000000',surface:'#0b0c0b',ink:'#e5e5e5'}
  };
  function applyReaderTheme(){
    const t = READER_THEMES[settings.readerTheme]||READER_THEMES.light;
    document.documentElement.style.setProperty('--reader-bg',t.bg);
    document.documentElement.style.setProperty('--reader-surface',t.surface);
    document.documentElement.style.setProperty('--reader-ink',t.ink);
    document.documentElement.style.setProperty('--reader-font', FONT_MAP[settings.readerFont]||FONT_MAP.serif);
    document.documentElement.style.setProperty('--reader-size', settings.readerSize+'px');
  }
  applyReaderTheme();

  /* ---------- Time tracking ---------- */
  function addReadingTime(ms){
    if(!ms || ms < 1000) return;
    const key = todayKey();
    dailyStats[key] = (dailyStats[key]||0) + ms;
    saveDaily();
    if(readingSessionBookId){
      const book = books.find(b=>b.id===readingSessionBookId);
      if(book){
        book.readTimeMs = (book.readTimeMs||0) + ms;
        saveBookDebounced(book);
      }
    }
  }
  function startReadingSession(bookId){
    if(readingSessionStart) stopReadingSession();
    readingSessionStart = Date.now();
    readingSessionBookId = bookId;
  }
  function stopReadingSession(){
    if(readingSessionStart){
      addReadingTime(Date.now() - readingSessionStart);
      readingSessionStart = null;
      readingSessionBookId = null;
    }
  }
  function todayReadMs(){ return dailyStats[todayKey()]||0; }

  /* ---------- Soft sound (Web Audio, no external files) ---------- */
  let audioCtx = null;
  function getAudioCtx(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
    }
    return audioCtx;
  }
  function playSoftWhoosh(){
    if(settings.soundMuted) return;
    const ctx = getAudioCtx(); if(!ctx) return;
    try{
      if(ctx.state==='suspended') ctx.resume();
      const t0 = ctx.currentTime;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(420, t0);
      o.frequency.exponentialRampToValueAtTime(180, t0+0.28);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.045, t0+0.04);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+0.32);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0+0.35);
      // soft harmonic
      const o2 = ctx.createOscillator();
      const g2 = ctx.createGain();
      o2.type = 'triangle';
      o2.frequency.setValueAtTime(620, t0);
      o2.frequency.exponentialRampToValueAtTime(240, t0+0.22);
      g2.gain.setValueAtTime(0.0001, t0);
      g2.gain.exponentialRampToValueAtTime(0.018, t0+0.03);
      g2.gain.exponentialRampToValueAtTime(0.0001, t0+0.25);
      o2.connect(g2); g2.connect(ctx.destination);
      o2.start(t0); o2.stop(t0+0.28);
    }catch(e){}
  }
  function playSoftChime(){
    if(settings.soundMuted) return;
    const ctx = getAudioCtx(); if(!ctx) return;
    try{
      if(ctx.state==='suspended') ctx.resume();
      const notes = [392, 523.25, 659.25]; // G4 C5 E5
      notes.forEach((f,i)=>{
        const t0 = ctx.currentTime + i*0.12;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.035, t0+0.04);
        g.gain.exponentialRampToValueAtTime(0.0001, t0+0.55);
        o.connect(g); g.connect(ctx.destination);
        o.start(t0); o.stop(t0+0.6);
      });
    }catch(e){}
  }

  /* ---------- File import / parsing (unchanged core) ---------- */
  function resolvePath(dir, href){
    href = href.split('#')[0];
    if(/^https?:\/\//.test(href)) return href;
    const combined = (dir? dir+'/':'') + href;
    const parts = combined.split('/'); const out=[];
    for(const p of parts){ if(p==='..') out.pop(); else if(p!=='.' && p!=='') out.push(p); }
    const result = out.join('/');
    try { return decodeURIComponent(result); } catch(e) { return result; }
  }
  function mimeFromExt(ext){
    ext=(ext||'').toLowerCase();
    if(ext==='png') return 'image/png';
    if(ext==='webp') return 'image/webp';
    if(ext==='gif') return 'image/gif';
    if(ext==='svg') return 'image/svg+xml';
    return 'image/jpeg';
  }
  function textToParagraphs(text){
    return text.split(/\n{2,}/).map(p=>'<p>'+escapeHtml(p.trim()).replace(/\n/g,'<br>')+'</p>').join('');
  }
  function sanitizeChapterHtml(html){
    try{
      const doc = new DOMParser().parseFromString(html,'text/html');
      doc.querySelectorAll('script,style,link,meta,img,svg').forEach(n=>n.remove());
      doc.querySelectorAll('*').forEach(n=>{
        [...n.attributes].forEach(a=>{ if(/^on/i.test(a.name) || a.name==='style' || a.name==='class') n.removeAttribute(a.name); });
      });
      return doc.body.innerHTML || '';
    }catch(e){ return '<p>'+escapeHtml(html.replace(/<[^>]+>/g,' '))+'</p>'; }
  }

  async function processEpub(file, book){
    const zip = await JSZip.loadAsync(file);
    book.fileBlob = file;
    const containerXml = await zip.file('META-INF/container.xml').async('string');
    const containerDoc = new DOMParser().parseFromString(containerXml,'application/xml');
    const opfPath = containerDoc.querySelector('rootfile').getAttribute('full-path');
    const opfDir = opfPath.includes('/') ? opfPath.split('/').slice(0,-1).join('/') : '';
    const opfText = await zip.file(opfPath).async('string');
    const opfDoc = new DOMParser().parseFromString(opfText,'application/xml');
    const titleNode = opfDoc.getElementsByTagNameNS('*','title')[0] || opfDoc.querySelector('title');
    const authorNode = opfDoc.getElementsByTagNameNS('*','creator')[0] || opfDoc.querySelector('creator');
    if(titleNode && titleNode.textContent.trim()) book.title = titleNode.textContent.trim();
    if(authorNode && authorNode.textContent.trim()) book.author = authorNode.textContent.trim();

    const manifestItems = {};
    opfDoc.querySelectorAll('manifest item').forEach(it=>{
      manifestItems[it.getAttribute('id')] = {
        href: it.getAttribute('href'), type: it.getAttribute('media-type')||'', props: it.getAttribute('properties')||''
      };
    });

    let coverId = opfDoc.querySelector('metadata meta[name="cover"]');
    coverId = coverId ? coverId.getAttribute('content') : null;
    let coverItem = coverId ? manifestItems[coverId] : null;
    if(!coverItem) coverItem = Object.values(manifestItems).find(it=> it.props.includes('cover-image'));
    if(!coverItem) coverItem = Object.values(manifestItems).find(it=> it.type.startsWith('image') && /cover/i.test(it.href));
    if(!coverItem) coverItem = Object.values(manifestItems).find(it=> it.type.startsWith('image'));
    if(coverItem){
      const path = resolvePath(opfDir, coverItem.href);
      const zf = zip.file(path);
      if(zf){
        const b64 = await zf.async('base64');
        book.cover = 'data:'+(coverItem.type||'image/jpeg')+';base64,'+b64;
      }
    }

    const idrefs=[];
    opfDoc.querySelectorAll('spine itemref').forEach(ir=> idrefs.push(ir.getAttribute('idref')));
    const chapters=[];
    for(const id2 of idrefs){
      const item = manifestItems[id2];
      if(!item || !/html|xml/i.test(item.type)) continue;
      const path = resolvePath(opfDir, item.href);
      const zf = zip.file(path);
      if(!zf) continue;
      const raw = await zf.async('string');
      chapters.push(sanitizeChapterHtml(raw));
    }
    book.chapters = chapters.length ? chapters : ['<p><i>Não foi possível extrair o texto deste EPUB, mas ele está salvo na sua biblioteca.</i></p>'];
  }

  async function processPdf(file, book){
    book.fileBlob = file;
    if(!window.pdfjsLib){ book.readable=false; book.importError=true; return; }
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: buf}).promise;
    book.pageCount = pdf.numPages;
    try{
      const meta = await pdf.getMetadata();
      if(meta && meta.info){
        if(meta.info.Title && meta.info.Title.trim()) book.title = meta.info.Title.trim();
        if(meta.info.Author && meta.info.Author.trim()) book.author = meta.info.Author.trim();
      }
    }catch(e){}
    const page = await pdf.getPage(1);
    const viewport = page.getViewport({scale:0.6});
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    await page.render({canvasContext:canvas.getContext('2d'), viewport}).promise;
    book.cover = canvas.toDataURL('image/jpeg',0.85);
  }

  async function processTxt(file, book){
    const text = await file.text();
    book.fileBlob = file;
    book.chapters = [textToParagraphs(text)];
  }

  async function processCbz(file, book){
    const zip = await JSZip.loadAsync(file);
    book.fileBlob = file;
    const imgs = Object.keys(zip.files).filter(n=> /\.(jpe?g|png|webp|gif)$/i.test(n) && !zip.files[n].dir);
    imgs.sort((a,b)=> a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'}));
    book.comicPages = imgs;
    if(imgs.length){
      const b64 = await zip.file(imgs[0]).async('base64');
      const ext = imgs[0].split('.').pop();
      book.cover = 'data:'+mimeFromExt(ext)+';base64,'+b64;
    }
  }

  async function processFile(file){
    const ext = (file.name.split('.').pop()||'').toLowerCase();
    const book = {
      id: uid(), title: file.name.replace(/\.[^.]+$/,''), author:'Autor desconhecido',
      format: ext, cover:null, addedAt: Date.now(), sizeBytes:file.size,
      status:'unread', favorite:false, shelfIds:[], progress:0, readTimeMs:0,
      gradient: Math.floor(Math.random()*3), chapters:null, fileBlob:null,
      pageCount:null, comicPages:null, readable:true, importError:false
    };
    try{
      if(ext==='epub') await processEpub(file, book);
      else if(ext==='pdf') await processPdf(file, book);
      else if(ext==='txt') await processTxt(file, book);
      else if(ext==='cbz') await processCbz(file, book);
      else { book.readable=false; book.fileBlob=file; }
    }catch(err){
      console.error('Erro ao importar', file.name, err);
      book.importError = true;
      book.fileBlob = file;
      if(ext==='pdf' || ext==='epub' || ext==='cbz') book.readable = false;
    }
    return book;
  }
